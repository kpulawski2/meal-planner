name: MealPlanner
options:
  bundleIdPrefix: com.kpulawski2
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  MealPlanner:
    type: application
    platform: iOS
    sources: [MealPlanner]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kpulawski2.MealPlanner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: MealPlanner/Info.plist
      properties:
        CFBundleDisplayName: Meal Planner
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        WKAppBoundDomains: [meal-planner-wm4j.onrender.com]
        NSCameraUsageDescription: "Scan a food barcode or record a recipe video you choose to import."
        NSMicrophoneUsageDescription: "Include audio only when you choose to record a recipe video."
        NSPhotoLibraryUsageDescription: "Choose a recipe video to import."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
  MealPlannerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MealPlannerTests]
    dependencies:
      - target: MealPlanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MealPlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MealPlannerUITests]
    dependencies:
      - target: MealPlanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MealPlanner:
    build:
      targets:
        MealPlanner: all
    test:
      targets: [MealPlannerTests, MealPlannerUITests]
