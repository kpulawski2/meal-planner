name: Audit Lidl GB public price sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Read the complete official sitemap and public content prices
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Audit all sitemap URL dispositions and non-product price sources
        run: python backend/audit_lidl_price_sources.py --seconds 1200
      - name: Retain source evidence and unreviewed price candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lidl-price-source-audit
          path: work/lidl-price-source-audit
          if-no-files-found: error
          retention-days: 7
