name: Refresh Lidl GB website catalogue
on:
  schedule:
    - cron: '55 5 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['backend/lidl_catalogue.py', 'backend/lidl_discovery.py', 'backend/lidl_categories.py', 'backend/refresh_lidl_catalogue.py', 'backend/tests/test_lidl*.py', '.github/workflows/refresh-lidl.yml']
  push:
    branches: [main]
    paths: ['backend/lidl_catalogue.py', 'backend/lidl_discovery.py', 'backend/lidl_categories.py', 'backend/refresh_lidl_catalogue.py', 'backend/tests/test_lidl*.py', '.github/workflows/refresh-lidl.yml']
permissions:
  contents: read
concurrency:
  group: lidl-catalogue-refresh
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests -v
  refresh:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      LIDL_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Expand the existing catalogue from official sitemap, search and regular prices
        run: python backend/refresh_lidl_catalogue.py
      - name: Commit validated Lidl website snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/lidl-products.json data/lidl-catalogue-meta.json
          if git diff --cached --quiet; then
            echo 'Catalogue unchanged.'
          else
            git commit -m 'Refresh validated Lidl GB website catalogue'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
  verify-live:
    name: Verify live Lidl refresh without publishing
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      LIDL_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Check the actual official sources and validate the complete snapshot
        run: python backend/refresh_lidl_catalogue.py
      - name: Retain the validated catalogue for review
        uses: actions/upload-artifact@v4
        with:
          name: validated-lidl-catalogue
          path: |
            data/lidl-products.json
            data/lidl-catalogue-meta.json
          if-no-files-found: error
          retention-days: 7
