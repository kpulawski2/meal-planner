name: Refresh ASDA product catalogue

on:
  schedule:
    - cron: '25 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/refresh-asda.yml'
      - 'backend/**'
      - 'recipe-import-api/**'
      - 'public/**'
      - 'Dockerfile'
      - 'package.json'
  push:
    paths:
      - '.github/workflows/refresh-asda.yml'
      - 'backend/**'
      - 'recipe-import-api/**'
      - 'public/**'
      - 'Dockerfile'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: asda-catalogue-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test catalogue, recipe imports and meal planning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install catalogue dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install app dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Test ASDA search-index refresh and partial-catalogue protection
        run: python -m unittest discover -s backend/tests -v
      - name: Check and test catalogue, imports, nutrition, variety and budgets
        run: |
          npm run check
          npm test

  refresh:
    name: Refresh and publish complete ASDA catalogue
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      CATALOGUE_WORKERS: '6'
      REQUEST_TIMEOUT: '30'
      REQUEST_RETRIES: '4'
      MIN_CATALOGUE_PRODUCTS: '100'
      ASDA_ALGOLIA_SEARCH_KEY: ${{ vars.ASDA_ALGOLIA_SEARCH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalogue dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Read every ASDA category, validate, and atomically publish products
        run: python backend/refresh_catalogue.py
      - name: Commit refreshed catalogue snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/products.json data/catalogue-meta.json
          if git diff --cached --quiet; then
            echo 'Catalogue is unchanged.'
          else
            git commit -m 'Refresh complete ASDA product catalogue'
            git push
          fi
