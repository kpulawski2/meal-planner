services:
  - type: web
    name: meal-planner-recipe-import
    runtime: docker
    rootDir: recipe-import-api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: IMPORT_API_TOKEN
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash,gemini-3.5-flash-lite
      - key: ALLOWED_ORIGINS
        value: https://kpulawski2.github.io
