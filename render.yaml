services:
  - type: web
    name: meal-planner-recipe-import
    runtime: docker
    rootDir: recipe-import-api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: IMPORT_API_TOKEN
        sync: false
      - key: GROQ_RECIPE_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_TRANSCRIPTION_MODEL
        value: whisper-large-v3-turbo
      - key: ALLOWED_ORIGINS
        value: https://kpulawski2.github.io
