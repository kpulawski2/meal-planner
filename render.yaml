services:
  - type: web
    name: meal-planner
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: IMPORT_API_TOKEN
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: ""
      - key: GROQ_RECIPE_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_TRANSCRIPTION_MODEL
        value: whisper-large-v3-turbo
      - key: BRAVE_SEARCH_INTERVAL_MS
        value: '350'
