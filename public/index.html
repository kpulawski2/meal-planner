const builtInMethods = {"breakfast":["Put the eggs in a small saucepan, cover with water and bring to a boil. Simmer for 8–10 minutes, then cool under cold water and peel.","Stir the Greek yoghurt, oats and cinnamon together in a bowl until combined.","Add the frozen berries and let them thaw slightly, then serve the yoghurt bowl with the boiled eggs on the side."],"eggs":["Toast the wholemeal bread. Slice the tomato while the bread toasts.","Beat the eggs in a bowl. Cook in a non-stick pan over low–medium heat, stirring gently until softly scrambled and fully set.","Serve the eggs with the toast, sliced tomato and Greek yoghurt on the side."],"fajita":["Rinse the rice, then cook it according to the packet instructions.","Slice the chicken into strips and toss with the fajita seasoning.","Heat the oil in a frying pan. Cook the chicken for about 5–7 minutes, turning until browned and cooked through (75°C in the thickest pieces).","Add the frozen peppers and cook for 5–7 minutes until hot and tender.","Serve over the rice with the Greek yoghurt."],"tuna":["Cook the pasta according to the packet instructions, then drain and rinse under cold water to cool.","Boil the egg for 9–10 minutes, cool under cold water, peel and chop.","Drain the tuna and sweetcorn. Mix with the Greek yoghurt, pasta and chopped egg.","Fold through the mixed salad just before serving. Chill leftovers promptly."],"chickencurry":["Rinse the rice and cook according to the packet instructions.","Cut the chicken into bite-sized pieces. Heat the oil in a pan and cook the chicken with the curry powder for 4–5 minutes, stirring.","Add the chopped tomatoes and frozen mixed vegetables. Simmer for 10–15 minutes, stirring occasionally, until the chicken is cooked through (75°C at the thickest piece).","Take the pan off the heat and stir in the Greek yoghurt. Serve with the rice."],"chillipotato":["Prick the potato several times. Microwave until soft (usually 7–12 minutes depending on size), turning halfway, or bake at 200°C until tender.","Heat the oil in a pan. Add the beef mince and cook, breaking it up, until browned with no pink remaining.","Stir in the kidney beans, chopped tomatoes and frozen vegetables. Simmer for 12–15 minutes until thick and the mince is fully cooked.","Split the potato, spoon over the chilli and finish with the Greek yoghurt."],"beefrice":["Rinse and cook the rice according to the packet instructions.","Cook the beef mince in a non-stick pan, breaking it up until browned and fully cooked.","Add the frozen mixed peppers and chopped tomatoes. Cook for 6–8 minutes until the peppers are tender and the sauce has reduced slightly.","Spoon the beef and peppers over the rice and serve with Greek yoghurt."],"snack":["Peel the banana and slice it into a bowl.","Add the cottage cheese and serve immediately. For a colder snack, chill the cottage cheese first."],"proteinpud":["Spoon the Greek yoghurt into a bowl.","Mix in the cocoa powder until evenly combined.","Top with the frozen berries. Let them thaw for a few minutes, or refrigerate the bowl until ready to eat."],"overnightoats":["Mix the oats, Greek yoghurt and milk in a lidded container until no dry oats remain.","Fold in the frozen berries.","Cover and refrigerate for at least 4 hours, preferably overnight. Stir before eating; add a small splash of milk only if you want a looser texture."],"eggwrap":["Beat the eggs and stir in the cottage cheese.","Pour into a non-stick frying pan over medium-low heat and gently scramble until the eggs are fully set. Add the chopped tomato for the final minute to warm it through.","Warm the wrap briefly, fill with the egg mixture and roll tightly."],"appleyog":["Core and dice the apple into small pieces.","Stir the Greek yoghurt, oats and cinnamon together in a bowl.","Fold in the apple and leave for 5 minutes so the oats begin to soften, or refrigerate overnight for a softer texture."],"chickenwrap":["Slice the chicken into thin strips. Cook in a non-stick frying pan over medium heat for 5–7 minutes, turning until fully cooked (75°C at the thickest point).","Stir the Greek yoghurt until smooth and use it as the wrap dressing.","Spread the yoghurt on the wrap, add the chicken and mixed salad, then roll tightly."],"beefpasta":["Cook the pasta according to the packet instructions and drain.","Cook the beef mince in a non-stick pan, breaking it up and stirring until browned and fully cooked.","Add the chopped tomatoes and frozen vegetables. Simmer for 8–10 minutes until the vegetables are hot and the sauce thickens.","Stir the pasta through the beef sauce and serve."],"tunasweet":["Prick the potato with a fork and microwave until soft, turning halfway, or bake at 200°C until tender.","Drain the tuna and sweetcorn, then mix with the Greek yoghurt.","Split the hot potato and pile the tuna mixture on top. Heat the sweetcorn with the tuna mixture briefly if you prefer it warm."],"tofurice":["Rinse and cook the rice according to the packet instructions.","Pat the tofu dry and cut into cubes. Use a hot non-stick pan to brown the cubes on several sides.","Add the frozen vegetables and cook until piping hot and tender, about 5–7 minutes.","Stir through the soy sauce and serve over the rice."],"turkeychilli":["Rinse and cook the rice according to the packet instructions.","Add the turkey mince to a non-stick pan and cook, breaking it apart, until no pink remains.","Add the kidney beans, chopped tomatoes and frozen vegetables. Simmer for 12–15 minutes until thick and the turkey is cooked through (75°C).","Serve the turkey chilli over the rice."],"chickentray":["Heat the oven to 200°C (180°C fan). Cut the potatoes into bite-sized chunks and toss with the oil.","Place the potatoes on a baking tray and roast for 15 minutes.","Add the chicken breast and frozen vegetables to the tray, turn the potatoes and roast for another 20–25 minutes, until the chicken reaches 75°C and the potatoes are golden and tender.","Rest the chicken for 2–3 minutes, then portion with the potatoes and vegetables."],"porknoodles":["Cook the noodles according to the packet instructions, then drain.","Slice the pork thinly. Cook in a hot non-stick frying pan, stirring, until browned and cooked through.","Add the frozen vegetables and stir-fry for 5–7 minutes until hot and tender.","Add the noodles and soy sauce, toss together for 1–2 minutes and serve."],"lentilcurry":["Rinse the rice and cook according to the packet instructions.","Put the lentils, chickpeas, chopped tomatoes and curry powder in a saucepan with enough water to cover the lentils well; bring to a simmer.","Simmer for 20–25 minutes, stirring often and adding a splash of water if it becomes too thick, until the lentils are soft. (If using ready-cooked lentils, simmer for 10–12 minutes instead.)","Serve the curry over rice."],"edamamesnack":["Cook the edamame according to the packet instructions (usually boil or microwave until piping hot).","Drain well and allow to cool until comfortable to eat.","Serve with the fruit. Add salt only if you have it and want it."],"cottagecrackers":["Spoon the cottage cheese into a bowl.","Slice the cucumber into sticks or rounds.","Serve the cottage cheese with the cucumber and wholegrain crackers."],"extra1":["Mix the Greek yoghurt, oats and peanut butter in a bowl or lidded jar until evenly combined.","Slice the banana and stir half through, reserving the rest for the top if preferred.","Eat straight away for a chewy texture, or cover and refrigerate overnight to soften the oats."],"extra2":["Put the oats, milk and cocoa powder in a saucepan and simmer gently for 4–6 minutes, stirring, until the oats are soft. Add a splash of water if needed.","Remove from the heat and leave for 1–2 minutes so it is not boiling hot. Stir in the protein powder until smooth.","Slice the banana over the top and serve. Avoid boiling the protein powder directly, as it can become lumpy."],"extra3":["Toast the bread and set aside.","Beat the eggs and cook in a non-stick pan over low heat, stirring until softly scrambled and fully set.","Remove from the heat and fold in the smoked salmon so it warms gently. Serve with the toast."],"extra4":["Dice the potato into small cubes. Microwave with a splash of water for 3–4 minutes to speed up cooking, then drain.","Slice the turkey sausages. Brown them in a non-stick pan according to pack directions, ensuring they are cooked through.","Add the potato cubes and cook until golden, stirring regularly. Add the spinach and stir until wilted.","Cook the egg in the pan or separately to your liking, ensuring the white is set, then serve on top of the hash."],"extra5":["Blend or mash the cottage cheese, eggs and oats into a thick batter.","Heat a good non-stick pan over medium-low heat. Spoon in small pancakes and cook for 2–3 minutes per side, turning when the edges set.","Heat the berries in a small pan or microwave until juicy and serve over the pancakes."],"extra6":["Brown the turkey mince in a non-stick pan, breaking it up until fully cooked through.","Beat the eggs, add them to the pan and stir until set. Dice the tomato and fold it through.","Warm the wrap, add the filling, tuck in the sides and roll into a burrito."],"extra7":["Core the apple and grate it or dice it finely.","Stir the oats, Greek yoghurt and cinnamon together in a lidded container, then fold through the apple.","Cover and refrigerate for at least 4 hours, preferably overnight. Stir before eating; the oats will soften as they absorb moisture."],"extra8":["Heat the oven to 180°C (160°C fan). Lightly grease a 3–4 cup muffin tin if needed.","Beat the eggs, then stir in the chopped spinach, crumbled feta and diced tomato.","Divide the mixture between muffin cups and bake for 15–20 minutes until puffed and set in the centre. Cool briefly before removing."],"extra9":["Beat the eggs in a shallow bowl and dip each slice of bread into the egg, coating both sides.","Cook in a non-stick frying pan over medium heat for 2–3 minutes per side, until golden and the egg is fully cooked.","Serve with the Greek yoghurt and berries. Thaw frozen berries briefly first if you prefer them less cold."],"extra10":["Stir the chia seeds and oats into the Greek yoghurt.","Fold through the frozen berries and add a small splash of water or milk only if you prefer a thinner pot.","Cover and refrigerate for at least 2 hours, ideally overnight, so the chia seeds and oats soften."],"extra11":["Cook the pasta according to the packet instructions. Reserve a small cup of pasta water before draining.","Slice the chicken into strips and cook in a non-stick pan until browned and cooked through (75°C at the thickest point).","Add the spinach to the pan and stir until wilted. Toss with the drained pasta and pesto, loosening with a little reserved pasta water if needed."],"extra12":["Heat the oven to 200°C (180°C fan). Cut the potato into wedges or cubes and roast until golden and tender, about 25–35 minutes, turning halfway.","Cook the chicken in a non-stick pan until browned and cooked through (75°C at the thickest point), then slice or chop.","Mix the Greek yoghurt with the hot sauce. Serve the chicken and potatoes over the mixed salad and drizzle with the sauce."],"extra13":["Cook the noodles according to the packet instructions, then drain.","Slice the chicken into thin strips and stir-fry in a non-stick pan until cooked through.","Add the frozen vegetables and stir-fry for 5–7 minutes until piping hot. Mix the soy sauce and honey, pour into the pan and toss to coat.","Add noodles, toss for a further minute and serve."],"extra14":["Cook the chicken in a non-stick pan until golden and cooked through (75°C at the thickest point), then slice.","Spread the Caesar dressing over the wrap.","Add the mixed salad and chicken, fold in the sides and roll tightly. Keep the dressing separate if preparing ahead to avoid a soggy wrap."],"extra15":["Heat the oven to 200°C (180°C fan). Pierce the sweet potato with a fork and rumble the feta.","Serve the chicken over couscous with the vegetables and feta."],"extra27":["Cook the pasta according to the packet instructions and drain.","Slice the turkey sausages and brown them in a pan according to the packet instructions, ensuring they are cooked through.","Add the chopped tomatoes and cannellini beans; simmer for 8–10 minutes. Stir in the spinach until wilted.","Toss the sauce with the pasta and serve."],"extra28":["Rinse and cook the rice according to packet instructions.","Cut the chicken into bite-sized pieces and cook in a non-stick pan until browned and cooked through (75°C at the thickest point).","Add the frozen vegetables and cook until piping hot. Pour in the teriyaki sauce and simmer for 1–2 minutes to coat the chicken and vegetables.","Serve over the rice."],"extra29":["Cook the noodles according to packet instructions, then drain.","Brown the beef mince in a hot non-stick pan until fully cooked.","Add the broccoli with a splash of water, cover and steam-fry for 4–6 minutes until tender and hot.","Add soy sauce and noodles, toss for 1–2 minutes and serve."],"extra30":["Cook the pasta according to packet instructions and drain.","Mix the turkey mince into small meatballs with clean hands. Brown in a non-stick pan, turning gently until cooked through; the centre should reach 75°C.","Add chopped tomatoes and simmer for 10–12 minutes until the sauce thickens and the meatballs are cooked through.","Serve over pasta and finish with the grated parmesan."],"extra31":["Heat the oven to 200°C (180°C fan). Rinse and cook the rice until just tender.","Cut the chicken into small pieces and cook in a non-stick pan until cooked through (75°C).","Mix the rice, chicken, chopped tomatoes and kidney beans in an ovenproof dish. Scatter the cheddar over the top.","Bake for 15–20 minutes until bubbling and hot throughout. Let stand for 5 minutes before portioning."],"extra32":["Cook the pasta according to packet instructions and drain, reserving a little pasta water.","Slice the chicken and cook in a non-stick pan until browned and cooked through (75°C at the thickest point). Remove to a plate.","Cook the sliced mushrooms in the same pan until softened. Stir in the light cream cheese and a splash of pasta water until a sauce forms.","Add the spinach until wilted, return the chicken to the pan and toss with the pasta."],"extra33":["Heat the oven to 200°C (180°C fan). Cut the potatoes into bite-sized chunks and roast for 25–35 minutes until tender, turning halfway.","Cook the chicken in a non-stick pan until browned and cooked through (75°C at the thickest point).","Mix the honey and mustard, brush over the chicken near the end of cooking and heat for another minute.","Steam or microwave the green beans until tender and serve with the chicken and potatoes."],"extra34":["Peel and chop the potatoes. Boil for 15–20 minutes until tender.","Meanwhile, sear the pork in a hot non-stick pan, then lower the heat and cook until the centre reaches 70°C followed by a 3-minute rest, or follow the pack instructions. Rest before slicing.","Drain the potatoes, mash until smooth, then stir in the Greek yoghurt.","Steam or microwave the green beans until tender and serve alongside the sliced pork and mash."],"extra35":["Dice the potato and boil for 15–20 minutes until soft; drain well and mash.","Brown the beef mince in a pan, breaking it up. Add diced carrot, peas and chopped tomatoes and simmer for 10–12 minutes until the mince is fully cooked and the mixture thickens.","Spoon the beef mixture into a bowl and top with the mashed potato. For a browned top, place under a hot grill for 3–5 minutes in an oven-safe dish."],"extra36":["Rinse and cook the rice according to packet instructions.","Cook the salmon in a non-stick pan or at 200°C oven heat until it flakes easily and is cooked through; follow the pack instructions for thickness.","Steam or microwave the broccoli until tender.","Brush or spoon teriyaki sauce over the salmon f  add dried herbs or seasoning only if available.","Serve the dip with the wholemeal pitta, warmed or toasted if preferred."],"extra61":["Stir the cocoa powder into the Greek yoghurt until smooth.","Finely chop or grate the dark chocolate and fold it through or sprinkle it on top.","Chill for 10 minutes for a thicker, mousse-like texture, or eat immediately."],"extra62":["Spoon the skyr into a bowl.","Wash and slice the pear, removing the core.","Serve the pear alongside or on top of the skyr."],"protein01":["Spoon the Skyr into a bowl and stir until smooth. If using a flavoured version, check its label because calories and sugar may differ.","Add the oats and chia seeds and mix well so there are no dry pockets.","Fold through the berries. Drizzle with the measured honey and eat straight away, or refrigerate for 10–15 minutes to soften the oats."],"protein02":["Mix the Skyr, oats, milk and chia seeds in a sealable container until all the oats are damp.","Slice half a banana and stir it through. Cover and refrigerate for at least 4 hours, preferably overnight.","In the morning, stir the oats; add a splash of milk if they're too thick. Top with the remaining banana if desired. Keep chilled until serving."],"protein03":["Mash the light cream cheese with a spoon until smooth, then beat in the Skyr and whey protein powder until lump-free.","Dice the apple finely and toss it with the cinnamon.","Put the oats in the bottom of a jar, spoon over the yoghurt mixture and top with the apple. Refrigerate for at least 30 minutes so the oats soften."],"protein04":["Toast the bread. Wash and dice the tomato; roughly chop the spinach.","Whisk the eggs with the cottage cheese. Heat a non-stick pan over low–medium heat and add the egg mixture.","Stir slowly until the eggs are fully set but still moist, about 3–5 minutes. Fold in the spinach and tomato for the final minute, then spoon over the toast."],"protein05":["Pat the tofu dry, crumble it into a bowl and dice the tomato.","Heat a d romaine just before eating so it stays crisp, then finish with finely grated Parmesan."],"protein10":["Drain the tuna and cannellini beans thoroughly. Rinse the beans under cold water and drain again.","Dice the cucumber and tomato. Mix the high-protein yoghurt with a squeeze of lemon juice to make a simple dressing.","Combine the tuna, beans and vegetables, then fold through the dressing. Taste and add extra lemon if available. Chill promptly if not eating straight away."],"protein11":["Rinse the rice and cook according to the packet instructions. If meal-prepping, spread cooked rice in a shallow container and cool promptly.","Heat a non-stick frying pan over medium-high heat. Add the beef mince and break it into small pieces; cook until well browned and no pink remains.","Stir in the soy sauce and honey. Add the edamame and grated carrot with a splash of water, then cook for 3–4 minutes until the edamame is piping hot.","Serve over the rice. For leftovers, refrigerate promptly and reheat until piping hot."],"protein12":["Slice the cucumber thinly and mix the Skyr with a little lemon juice and black pepper if available.","Cut the bagel in half and toast it to your preferred level.","Spread the Skyr mixture on each half, add the smoked salmon and cucumber, and close the bagel. Keep refrigerated until serving; do not leave it warm for extended periods."],"protein13":["Mix the turkey mince with the dried herbs. Shape into 4–5 small meatballs, washing your hands after handling raw mince.","Brown the meatballs in a non-stick pan over medium heat, turning carefully. Add the passata, cover and simmer for 10–12 minutes until cooked through (75°C in the centre).","Warm the pitta. Mix the high-protein yoghurt with a spoonful of water to loosen it, then add lettuce, meatballs and tomato sauce to the pitta. Spoon over the yoghurt sauce."],"protein14":["Prick the potato all over with a fork. Microwave for 7–12 minutes, turning halfway, until soft, or bake at 200°C (180°C fan) for 45–60 minutes depending on size.","Drain the tuna and sweetcorn. Mix with the cottage cheese in a bowl; add black pepper or chopped herbs if available.","Split the cooked potato, fluff the centre with a fork and spoon the tuna mixture over it. For a cold filling, keep it chilled until serving."],"protein15":["Pour boiling water over the couscous in a heatproof bowl, following the packet's water ratio. Cover for 5 minutes, then fluff with a fork.","Cut the chicken into strips and cook in a non-stick pan over medium heat until browned and fully cooked (75°C at the thickest point).","Stir the pesto into the warm couscous, then fold in the halved cherry tomatoes and spinach so the spinach just begins to wilt.","Serve with the chicken and a spoonful of Skyr stirred with a little water to make a creamy dressing."],"protein16":["Heat the oven to 200°C (180°C fan). Cut the chicken into bite-sized pieces and season with dried herbs if available.","Put the orzo, chopped tomatoes and chicken stock in an ovenproof dish and stir. Nestle the chicken into the mixture and cover tightly with foil.","Bake for 20 minutes, stir, then bake for another 10–15 minutes until the orzo is tender and the chicken reaches 75°C. Add a splash of water if it looks dry before the orzo is cooked.","Stir in the spinach until wilted and crumble the feta over the top. Rest for 3 minutes before serving."],"protein17":["Put the couscous in a bowl and cover with boiling water according to the packet. Cover for 5 minutes, then fluff with a fork.","Mix the beef mince with cumin. Shape into small koftas around skewers or into oval patties; wash hands and utensils after touching raw mince.","Cook in a hot non-stick pan for 8–10 minutes, turning often, until browned and cooked through with no pink centre. For a thermometer check, aim for 75°C in the centre.","Dice the cucumber and tomato. Mix the Skyr with a spoonful of water for a quick sauce, then plate the koftas over couscous with salad and sauce."],"protein18":["Heat the oven to 200°C (180°C fan). Cut the potatoes into even chunks and boil for 8 minutes, then drain well.","Put the potatoes on a baking tray, toss with a little cooking oil if available and roast for 20 minutes. Add the salmon to the tray and bake for another 12–15 minutes, depending on thickness, until it flakes and is cooked through.","Steam or boil the green beans for 4–6 minutes until tender. Mix the Skyr with lemon juice and dill to make a cool sauce.","Serve the salmon with the potatoes, beans and lemon-yoghurt sauce. Keep the sauce separate if packing for later."],"protein19":["Cook the pasta according to its packet instructions. Reserve a little pasta water before draining.","Blend or mash the cottage cheese with the milk and garlic until smooth. If using a blender, scrape down the sides once.","Cut the chicken into small strips and pan-cook until browned and fully cooked (75°C). Add the spinach and stir until wilted.","Turn the heat to low. Stir in the cottage cheese sauce and drained pasta, adding a little pasta water to loosen it. Warm gently without boiling hard, then serve."],"protein20":["Mix the turkey mince with the finely diced onion. Shape into 8 small meatballs, washing hands and surfaces after handling raw mince.","Brown the meatballs in a large non-stick pan, turning gently. Add the passata and simmer covered for 10–12 minutes until the meatballs are cooked through (75°C in the centre).","Meanwhile, cook the orzo in boiling water according to the packet, then drain.","Stir the orzo into the tomato sauce, spoon into bowls and finish with the Parmesan."],"protein21":["Rinse the rice and cook according to the packet instructions.","Warm the curry paste in a saucepan for 30 seconds, stirring. Add the light coconut milk and a splash of water, then simmer for 3 minutes.","Add the prawns and simmer until opaque and cooked through; follow pack instructions if they are raw or already cooked. Add the spinach for the final 1–2 minutes until wilted.","Serve immediately over rice. Refrigerate leftovers promptly and reheat until piping hot only once."],"protein22":["Rinse and cook the rice according to the packet instructions.","Pat the tofu dry and cut into cubes. Brown in a non-stick pan on several sides for 6–8 minutes, turning as it colours.","Stir the curry paste and peanut butter together with the light coconut milk and a splash of water. Pour over the tofu and simmer gently for 5 minutes.","Add the broccoli and cook until tender but still bright green, adding a little water if the sauce thickens too much. Serve over rice."],"protein23":["Cut the potatoes into even chunks and boil for 12–15 minutes until tender; drain. Steam or boil the green beans for 4–6 minutes.","Trim the pork into medallions. Heat a non-stick pan and cook for 3–5 minutes per side depending on thickness, until cooked through (aim for 70°C and allow a 3-minute rest).","Remove the pan from the heat. Stir the mustard into the Skyr with a spoonful of warm water, then add it to the pan off the heat so the yoghurt stays creamy.","Serve the pork with the potatoes and beans, spooning the mustard-Skyr sauce over the meat."],"protein24":["Spoon the Skyr into a bowl and sift in the cocoa powder to avoid lumps.","Stir in the whey protein powder a little at a time until smooth. Add a teaspoon of cold water if the mixture becomes too thick.","Top with the berries and chill for 10 minutes for a thicker mousse texture, or eat straight away."],"protein25":["Stir the whey protein into the high-protein yoghurt until smooth. If it becomes very thick, add a teaspoon of water.","Spread the mixture in a thin layer on a baking-paper-lined tray or freezer-safe plate. Scatter the berries and finely chopped dark chocolate over the top.","Freeze for 2–3 hours until firm, then break into pieces. Eat straight from the freezer; it softens quickly. Freeze leftovers in a sealed container."],"protein26":["Crush the oat biscuits into fine crumbs and press them into the bottom of a small pot.","Mix the quark, whey protein, lemon juice and sweetener until smooth. Taste and add a little more lemon if you prefer a sharper flavour.","Spoon over the biscuit base and refrigerate for at least 30 minutes to thicken. Keep chilled until eating."],"protein27":["Blend or mash the cottage cheese with the high-protein yoghurt until smooth; a fork works if you don't mind a little texture.","Stir in the dried herbs and chill for 10 minutes so the flavours develop.","Cut the carrot and cucumber into sticks. Serve with the dip, keeping it refrigerated until snack time."],"protein28":["Cook the edamame according to the packet instructions until piping hot, then drain well.","Mix the cottage cheese with lime juice and a small pinch of chilli flakes.","Spoon the edamame into a bowl and top with the lime cottage cheese. Serve warm or chill promptly for later."],"protein29":["Spoon the Skyr into a bowl and stir in the cinnamon.","Chop the dates and walnuts into small pieces; check dates for stones if not already pitted.","Scatter the dates and walnuts over the Skyr. Serve straight away, or pack chilled and add the nuts just before eating to keep their texture."],"protein30":["Rinse the rice and cook according to the packet. For best fried rice texture, spread it on a shallow plate and let steam escape for a few minutes; use leftover rice only if it was cooled and refrigerated safely.","Heat a non-stick wok or large pan. Add the edamame and frozen vegetables with a splash of water and cook until piping hot.","Push the vegetables to one side. Add the beaten eggs and egg whites and stir until fully set, then mix with the vegetables.","Add the rice and soy sauce, stir-fry for 2–3 minutes until everything is hot, and serve immediately. Cool leftovers quickly and refrigerate."]};

}

 const controller=new AbortController();let timedOut=false;
 const cancel=()=>controller.abort();signal.addEventListener('abort',cancel,{once:true});if(signal.aborted)controller.abort();

 try{

  const body=await response.text();let data=null;try{if(body.trim())data=JSON.parse(body)}catch{}
  if(!response.ok){const transient=[408,425,429,500,502,503,504].includes(response.status);throw automaticCatalogError(transient?'ASDA matching is taking longer than usual.':'This shopping list could not be matched right now.',transient,transient?automaticCatalogRetryAfter(response):0)}

 }catch(error){if(signal.aborted)throw error;if(timedOut)throw automaticCatalogError('ASDA matching is taking longer than usual.');if(error?.retryable!==undefined)throw error;throw automaticCatalogError('The connection to ASDA matching was interrupted.')}finally{clearTimeout(timer);signal.removeEventListener('abort',cancel)}

async function requestAutomaticCatalogMatches(entries,store){
 const items=store==='Asda'?automaticCatalogItems(entries):[];
 if(!items.length){if(automaticCatalogController){automaticCatalogController.abort();automaticCatalogController=null;++automaticCatalogRequestId}automaticCatalogState={store,fingerprint:'',status:'idle',results:{},items:[],error:'',attempt:0,retryAt:0};return}
 const fingerprint=automaticCatalogFingerprint(store,items),previous=automaticCatalogState;
 if(previous.fingerprint===fingerprint&&(previous.status==='loading'||previous.status==='ready'&&Date.now()-(previous.loadedAt||0)<AUTOMATIC_CATALOG_REFRESH_MS||previous.status==='error'&&Date.now()<previous.retryAt))return;
 if(automaticCatalogController)automaticCatalogController.abort();
 const controller=new AbortController(),requestId=++automaticCatalogRequestId;automaticCatalogController=controller;
 const previousItems=new Map((previous.items||[]).map(item=>[item.key,JSON.stringify(item)]));
 const results=previous.store===store?Object.fromEntries(items.filter(item=>previousItems.get(item.key)===JSON.stringify(item)&&previous.results[item.key]).map(item=>[item.key,previous.results[item.key]])):{};
 automaticCatalogState={store,fingerprint,status:'loading',results,items,error:'',attempt:1,retryAt:0};refreshAutomaticCatalogViews();
 try{
  for(let attempt=1;attempt<=AUTOMATIC_CATALOG_MAX_ATTEMPTS;attempt++){
   try{const data=await fetchAutomaticCatalogRecommendations(store,items,controller.signal);if(requestId!==automaticCatalogRequestId||controller.signal.aborted)return;automaticCatalogState={store,fingerprint,status:'ready',results:Object.fromEntries(data.recommendations.map(result=>[result.key,result])),items,error:'',attempt,retryAt:0,loadedAt:Date.now()};refreshAutomaticCatalogViews();return}
   catch(error){if(requestId!==automaticCatalogRequestId||controller.signal.aborted)return;if(!error.retryable||attempt===AUTOMATIC_CATALOG_MAX_ATTEMPTS){automaticCatalogState={store,fingerprint,status:'error',results,items,error:'ASDA matching could not respond. It will retry when you return to Shopping or your connection returns.',attempt,retryAt:Date.now()+Math.max(AUTOMATIC_CATALOG_RETRY_COOLDOWN_MS,error.retryAfterMs||0)};refreshAutomaticCatalogViews();return}automaticCatalogState={...automaticCatalogState,attempt:attempt+1,error:'The connection was interrupted. Retrying automatically…'};refreshAutomaticCatalogViews();await automaticCatalogDelay(Math.max(1500*2**(attempt-1),error.retryAfterMs||0),controller.signal)}

}
function automaticCatalogNeedsRefresh(){return automaticCatalogState.status==='ready'&&Date.now()-(automaticCatalogState.loadedAt||0)>=AUTOMATIC_CATALOG_REFRESH_MS||automaticCatalogState.status==='error'&&Date.now()>=automaticCatalogState.retryAt}

function exportPriceReferenceCsv() {
  const entries=Object.entries(buildShopping()),store=selectedShoppingStore(),basket=automaticCatalogBasket(entries,store);
  const rows=[['Ingredient','Quantity needed','Retailer','Product','Packs','Pack size','Pack price GBP','Line total GBP','Product URL','Catalogue updated','Status']];
  for(let index=0;index<basket.items.length;index++){
    const item=basket.items[index],result=basket.results[index];
    const quantity=`${fmt(item.quantity)} ${item.dimension==='mass'?'g':item.dimension==='volume'?'ml':item.dimension||'quantity unknown'}`;
    if(automaticCatalogPlanValid(result?.plan)){
      for(const product of result.plan.products)rows.push([item.name,quantity,store,product.productName,product.packs,product.packSize||`${product.packQuantity||''} ${product.packUnit||''}`,product.priceGBP??(Number(product.costGBP)/Number(product.packs)),product.costGBP,product.url,result.match?.checkedAt||'',result.plan.estimatedQuantity?'Automatically priced; estimated produce quantity':'Automatically priced']);
    }else rows.push([item.name,quantity,store,result?.match?.productName||'','','',result?.match?.priceGBP??'','',result?.match?.url||'',result?.match?.checkedAt||'',store!=='Asda'?'Automatic retailer data unavailable':basket.status==='loading'?'Pricing in progress':'Not automatically priced']);
  }
  const csvCell=value=>{const text=String(value??'');return '"'+(/^[=+@\t\r-]/.test(text)?"'":'')+text.replace(/"/g,'""')+'"';};
  const csv='\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download=`meal-planner-priced-list-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);toast('Automatic shopping prices exported');

function shoppingListText() {

function toggleGoal(goal){captureProfileDraft();const goals=selectedPlannerGoals();state.profile.goal=goals.includes(goal)?goals.filter(item=>item!==goal):[...goals,goal];state.goalVersion=1;document.querySelectorAll('[data-goal]').forEach(button=>{const selected=state.profile.goal.includes(button.dataset.goal);button.classList.toggle('on',selected);button.setAttribute('aria-pressed',String(selected));});const details=document.getElementById('goalDetails');if(details)details.innerHTML=goalDetailsHtml();save();}
function toggleEquipment(item){captureProfileDraft();const selected=Array.isArray(state.profile.equipment)?state.profile.equipment:[];state.profile.equipment=selected.includes(item)?selected.filter(value=>value!==item):[...selected,item];save();renderProfile();}
function toggleShop(store){captureProfileDraft();const selected=state.profile.supermarkets||[];state.profile.supermarkets=selected.includes(store)?selected.filter(item=>item!==store):[...selected,store];save();renderProfile();}
let pendingSwap=null;
function swapMeal(day,idx){
 const d=state.week.find(x=>x.day===day);if(!d||!d.meals[idx])return;
 const current=getRecipe(d.meals[idx]);
 let candidates=recipes.filter(r=>r.cat===current.cat&&r.id!==current.id&&recipeAllowed(r));
 // When there are very few same-category choices, also offer other suitable recipes.
 if(candidates.length<3){const extra=recipes.filter(r=>r.cat!==current.cat&&r.id!==current.id&&recipeAllowed(r));candidates=[...candidates,...extra.map(r=>({...r,_otherCategory:true}))]}
 if(!candidates.length){toast('No suitable alternatives available. Add a recipe or adjust your dietary settings.');return}
 const likes=(state.profile.likes||'').toLowerCase().split(',').map(x=>x.trim()).filter(Boolean);
 candidates.sort((a,b)=>swapCandidateScore(b,current,likes)-swapCandidateScore(a,current,likes));
 pendingSwap={day,idx,currentId:current.id,candidates};
 renderSwapModal();
}
function swapCandidateScore(r,current,likes){let score=Math.random()*0.15;const hay=(r.name+' '+r.ings.map(x=>x[0]).join(' ')).toLowerCase();if((state.favorites||[]).includes(r.id))score+=4;if(likes.some(x=>x&&hay.includes(x)))score+=1.6;if(r.custom)score+=0.5;if(r._otherCategory)score-=5;const catalogueCost=automaticRecipeCost(r);if(state.profile.priority==='Cheapest'&&catalogueCost!==null)score-=catalogueCost;if(state.profile.priority==='Protein value'&&catalogueCost!==null)score+=(recipeNutrition(r).p||0)/Math.max(.1,catalogueCost);const cn=recipeNutrition(current),rn=recipeNutrition(r);if(cn.kcal!==null&&rn.kcal!==null)score-=Math.abs(cn.kcal-rn.kcal)*0.002;if(cn.p!==null&&rn.p!==null)score-=Math.abs(cn.p-rn.p)*0.018;return score}
function swapOptionCards(list){return list.map(r=>{const n=recipeNutrition(r);return `<div class="swap-option"><div class="swap-option-top"><div class="swap-option-icon">${escape(r.icon||'🍽️')}</div><div class="swap-option-main"><div class="swap-option-name">${escape(r.name)}</div><div class="swap-option-meta">${r._otherCategory?escape(r.cat)+' · Other meal type':escape(r.cat)}<br>${n.kcal===null?'Calories unavailable':`~${n.kcal} kcal`} · ${n.p===null?'Protein unavailable':`~${n.p}g protein`}<br>${recipeCostText(r)}</div></div></div><div class="swap-option-ings">${escape(r.ings.slice(0,4).map(x=>x[0]).join(' · '))}${r.ings.length>4?' · more':''}</div><div class="nutrition-note">${escape(nutritionSourceLabel(n))}</div><div class="swap-option-actions"><button class="choose" onclick="chooseSwapMeal('${r.id}')">Choose this</button><button class="view" onclick="viewSwapRecipe('${r.id}')">View recipe</button></div></div>`}).join('')||'<div class="swap-empty">No recipes match that search. Try another ingredient or clear the search.</div>'}
function renderSwapModal(){
 if(!pendingSwap)return;
 const current=getRecipe(pendingSwap.currentId),candidates=pendingSwap.candidates;
 pendingSwap.filters=pendingSwap.filters||{query:'',maxKcal:'',minProtein:'',maxCost:''};
 const f=pendingSwap.filters;
 document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal();pendingSwap=null">×</button><h2>Swap ${escape((current.cat||'meal').toLowerCase())}</h2><p class="sub">Choose from several alternatives at once. Your current meal is <b>${escape(current.name)}</b>.</p><div class="swap-intro">${candidates.length} suitable alternative${candidates.length===1?'':'s'} available${candidates.some(r=>r._otherCategory)?'. Same-category options appear first; other meal types are included because there are few matches.':` in ${escape(current.cat)}.`} Nutrition is estimated. Cost filters use known catalogue ingredient values; unpriced recipes are excluded when a cost limit is set. Swapping can change whole-pack checkout cost; the basket is checked again automatically.</div><div class="swap-search"><input id="swapSearch" type="search" value="${escape(f.query)}" placeholder="Search recipes or ingredients…" oninput="filterSwapOptions()"></div><div class="swap-filters"><div class="swap-filter"><label for="swapMaxKcal">Max calories</label><input id="swapMaxKcal" type="number" min="0" step="25" value="${escape(f.maxKcal)}" placeholder="Any" oninput="filterSwapOptions()"></div><div class="swap-filter"><label for="swapMinProtein">Min protein (g)</label><input id="swapMinProtein" type="number" min="0" step="5" value="${escape(f.minProtein)}" placeholder="Any" oninput="filterSwapOptions()"></div><div class="swap-filter"><label for="swapMaxCost">Max known ingredient cost (£/portion)</label><input id="swapMaxCost" type="number" min="0" step="any" value="${escape(f.maxCost)}" placeholder="Any" oninput="filterSwapOptions()"></div></div><div class="swap-filter-tools"><span id="swapResultCount" aria-live="polite"></span><button type="button" onclick="resetSwapFilters()">Clear filters</button></div><div id="swapOptionList" class="swap-list"></div><div class="actions"><button class="btn secondary" onclick="closeModal();pendingSwap=null">Cancel</button></div>`;
 document.getElementById('modal').style.display='flex';filterSwapOptions();
}
function filterSwapOptions(){
 if(!pendingSwap)return;
 const read=(id)=>document.getElementById(id)?.value||'';
 pendingSwap.filters={query:read('swapSearch').toLowerCase().trim(),maxKcal:read('swapMaxKcal'),minProtein:read('swapMinProtein'),maxCost:read('swapMaxCost')};
 const f=pendingSwap.filters;
 let list=pendingSwap.candidates.filter(r=>{
  const hay=(r.name+' '+r.cat+' '+r.ings.map(x=>x[0]).join(' ')).toLowerCase();
  if(f.query&&!hay.includes(f.query))return false;
  const hasNumber=v=>v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v));
  const n=recipeNutrition(r);
  if(f.maxKcal!==''&&(!hasNumber(n.kcal)||Number(n.kcal)>Number(f.maxKcal)))return false;
  if(f.minProtein!==''&&(!hasNumber(n.p)||Number(n.p)<Number(f.minProtein)))return false;
  const catalogueCost=automaticRecipeCost(r);if(f.maxCost!==''&&(catalogueCost===null||catalogueCost>Number(f.maxCost)))return false;
  return true;
 });
 const listEl=document.getElementById('swapOptionList');if(listEl)listEl.innerHTML=swapOptionCards(list);
 const countEl=document.getElementById('swapResultCount');if(countEl)countEl.textContent=`Showing ${list.length} of ${pendingSwap.candidates.length} options`;
}
function resetSwapFilters(){if(!pendingSwap)return;pendingSwap.filters={query:'',maxKcal:'',minProtein:'',maxCost:''};renderSwapModal()}
function chooseSwapMeal(id){if(!pendingSwap)return;const d=state.week.find(x=>x.day===pendingSwap.day);const r=getRecipe(id);if(!d||!r||!recipeAllowed(r)){toast('That recipe is no longer suitable with your settings.');return}d.meals[pendingSwap.idx]=id;const day=pendingSwap.day;pendingSwap=null;closeModal();save();renderAll();toast(`${r.name} added to ${day}`)}
function viewSwapRecipe(id){if(!pendingSwap)return;showRecipe(id);const actions=document.querySelector('#sheet .actions');if(actions){const back=document.createElement('button');back.className='btn secondary';back.textContent='Back to options';back.onclick=renderSwapModal;actions.appendChild(back)}}
let recipeModalContext=null,recipeModalRecipeId=null,recipeModalTargetServings=1;

 const base=Math.max(1,Number(r.servings)||1),initial=recipeModalContext?getMealServings(day,idx):Math.max(1,Number(state.profile.people)||1),n=recipeNutrition(r);recipeModalTargetServings=initial;

>Edit recipe</button>`:''}<button class="btn secondary" onclick="closeModal()">Done</button></div>`;
 document.getElementById('modal').style.display='flex';updateRecipeServingPreview();
}
function updateRecipeServingPreview(){
 const r=getRecipe(recipeModalRecipeId);if(!r)return;const input=document.getElementById('recipeTargetServings');if(!input)return;
 const portions=Math.max(.25,Math.min(100,Number(input.value)||1));recipeModalTargetServings=portions;const base=Math.max(1,Number(r.servings)||1),batches=r.fixedBatch?Math.ceil(portions/base):null,factor=r.fixedBatch?batches:portions/base,n=recipeNutrition(r);
 if(!n.complete){
  const preview=document.getElementById('recipeNutritionPreview');if(preview)preview.innerHTML='<p class="sub">Nutrition needs review: '+escape((n.missing||[]).join(', ')||'missing recipe details')+'</p>';
  const ing=document.getElementById('recipeIngredientPreview');if(ing)ing.innerHTML=(r.ings||[]).map(x=>'<div class="recipe-ing"><span>'+escape(x[0])+'</span><b>'+escape(ingredientQuantityLabel(x[1],x[2],r.servings===null?1:factor,x[0]))+'</b></div>').join('');
  return;
 }
 const total=(v)=>v===null||v===undefined?'—':Math.round(Number(v)*portions);const total1=(v)=>v===null||v===undefined?'—':Math.round(Number(v)*portions*10)/10;
 const preview=document.getElementById('recipeNutritionPreview');if(preview)preview.innerHTML=`${r.fixedBatch?'<div class="recipe-freeze">Prepare '+batches+' whole tub'+(batches===1?'':'s')+' ('+(batches*base)+' servings). Eat '+portionLabel(portions)+' portion'+(portions===1?'':'s')+'; keep '+portionLabel(batches*base-portions)+' frozen for later.</div>':''}<b>For ${portions} portion${portions===1?'':'s'}</b><p style="margin:7px 0">${total(n.kcal)==='—'?'Calories unavailable':`~${total(n.kcal)} kcal`} · ${total1(n.p)==='—'?'Protein unavailable':`~${total1(n.p)}g protein`} · ${total1(n.c)==='—'?'Carbs unavailable':`~${total1(n.c)}g carbs`} · ${total1(n.f)==='—'?'Fat unavailable':`~${total1(n.f)}g fat`}</p><small class="sub">Per portion: ${n.kcal===null?'—':`~${n.kcal} kcal`} · ${n.p===null?'—':`~${n.p}g protein`} · ${n.source==='ingredients'?'calculated from ingredient quantities':n.source==='verified'?'verified by you':'saved estimate'}</small>${n.missing?.length?`<p class="sub">Needs checking: ${escape(n.missing.join(', '))}</p>`:''}${n.assumptions?.length?`<p class="sub">Typical measure assumed for: ${escape(n.assumptions.join(', '))}</p>`:''}`;
 const ing=document.getElementById('recipeIngredientPreview');if(ing)ing.innerHTML=(r.ings||[]).map(x=>`<div class="recipe-ing"><span>${escape(x[0])}</span><b>${escape(ingredientQuantityLabel(x[1],x[2],factor,x[0]))}</b></div>`).join('');
}

let pendingPlanRecipeId=null,pendingPlanServings=null;
function openAddToPlan(id,useModalServings=false){
 const r=getRecipe(id);if(!r)return;
 if(!recipeEquipmentReady(r)){toast('Turn on Ninja CREAMi in Settings before adding this tub to your plan.');return}
 if(r.collection==='web'&&recipeNeedsReview(r)){showRecipe(id);toast('Review the missing recipe details before planning this meal.');return}
 if(!recipeAllowed(r)){toast('This recipe conflicts with your current diet or foods-to-avoid settings. Review Settings before adding it.');return}
 if(!state.week.length){showTab('week');toast('Fit a plan to your budget first, then add this recipe.');return}
 pendingPlanRecipeId=id;pendingPlanServings=(useModalServings&&recipeModalRecipeId===id)?recipeModalTargetServings:Math.max(1,Number(state.profile.people)||1);
 const todayIdx=(new Date().getDay()+6)%7;
 const suggestedDay=Math.min(todayIdx,state.week.length-1);
 document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>＋ Add to meal plan</h2><p class="sub">Add <b>${escape(r.name)}</b> to your current plan. Replacing a meal keeps the day's meal count unchanged; adding as an extra meal increases that day's total.</p><div class="field"><label>Day</label><select id="addPlanDay" onchange="updateAddPlanTargets()">${state.week.map((d,i)=>`<option value="${i}" ${i===suggestedDay?'selected':''}>${escape(d.day)}</option>`).join('')}</select></div><div class="field"><label>How should it be added?</label><select id="addPlanMode" onchange="updateAddPlanTargets()"><option value="replace">Replace an existing meal (recommended)</option><option value="extra">Add as an extra meal</option></select></div><div class="field" id="addPlanTargetWrap"><label>Meal to replace</label><select id="addPlanTarget"></select><p class="sub" id="addPlanTargetHint">A meal of the same type is selected where possible.</p></div><div class="actions"><button class="btn" onclick="confirmAddRecipeToPlan()">Add to plan</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`;
 updateAddPlanTargets();document.getElementById('modal').style.display='flex';
}
function updateAddPlanTargets(){
 const daySel=document.getElementById('addPlanDay'),modeSel=document.getElementById('addPlanMode'),targetWrap=document.getElementById('addPlanTargetWrap'),targetSel=document.getElementById('addPlanTarget'),hint=document.getElementById('addPlanTargetHint');
 if(!daySel||!modeSel||!targetWrap||!targetSel)return;
 const day=state.week[+daySel.value],r=getRecipe(pendingPlanRecipeId);if(!day||!r)return;
 if(modeSel.value==='extra'){targetWrap.style.display='none';return}
 targetWrap.style.display='block';
 const slots=day.meals.map((rid,i)=>({rid,i,recipe:getRecipe(rid)}));
 const matching=slots.filter(x=>x.recipe&&x.recipe.cat===r.cat);
 const options=matching.length?matching:slots;
 targetSel.innerHTML=options.map(x=>`<option value="${x.i}">${escape(x.recipe.cat||'Meal')}: ${escape(x.recipe.name)}${x.recipe.cat===r.cat?'':' (different meal type)'}</option>`).join('');
 targetSel.disabled=!options.length;
 hint.textContent=matching.length?'A meal of the same type is selected where possible.':'No planned meal of this type exists on this day, so choose the meal to replace or add it as an extra meal.';
}
function confirmAddRecipeToPlan(){
 const r=getRecipe(pendingPlanRecipeId),daySel=document.getElementById('addPlanDay'),modeSel=document.getElementById('addPlanMode'),targetSel=document.getElementById('addPlanTarget');
 if(!r||!daySel||!modeSel)return;
 if(!recipeAllowed(r)){toast('This recipe conflicts with your current diet or foods-to-avoid settings.');return}
 const d=state.week[+daySel.value];if(!d){toast('Choose a day in your plan');return}
 let plannedIndex;if(modeSel.value==='extra'){plannedIndex=d.meals.length;d.meals.push(r.id)}else{if(!targetSel||targetSel.value===''){toast('There is no meal to replace on this day. Choose “Add as an extra meal”.');return}plannedIndex=+targetSel.value;d.meals[plannedIndex]=r.id}
 state.mealServings=state.mealServings||{};state.mealServings[mealKey(d.day,plannedIndex)]=Math.max(.25,Number(pendingPlanServings)||Number(state.profile.people)||1);
 save();closeModal();renderAll();showTab('week');toast(modeSel.value==='extra'?'Recipe added as an extra meal':'Planned meal replaced with your recipe');pendingPlanRecipeId=null;pendingPlanServings=null;

 const readNutrition=id=>{const value=document.getElementById(id).value.trim();return value!==''&&Number.isFinite(Number(value))&&Number(value)>=0?Number(value):null;};
 const recipe={id:'user_'+Date.now(),name,icon:document.getElementById('newIcon').value,cat:document.getElementById('newCat').value,kcal:readNutrition('newKcal'),p:readNutrition('newProtein'),c:null,f:null,cost:null,ings:ingredients,source,method:document.getElementById('newMethod').value.trim(),servings,cookTime:Number(document.getElementById('newCookTime').value)>0?Number(document.getElementById('newCookTime').value):null,nutritionStatus:document.getElementById('newNutritionStatus').value==='verified'?'verified':'estimated',custom:true};
 state.customRecipes.push(recipe);recipes.push(recipe);save();closeModal();renderRecipes();toast('Recipe saved');
}

function showTab(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));if(id==='home')renderHome();if(id==='week')renderWeek();if(id==='shop')renderShop();if(id==='pantry')renderPantry();if(id==='recipes')renderRecipes();if(id==='profile')renderProfile();if(typeof window.scrollTo==='function')window.scrollTo({top:0,left:0,behavior:'instant'});}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function renderAll(){renderHome();renderWeek();renderShop();renderPantry();renderRecipes();renderProfile()}
renderAll();
loadRecipeLibrary();

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')) { window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js').catch(()=>{})); }
