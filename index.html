let state=JSON.parse(localStorage.getItem('mealPlannerState')||'null')||{profile:defaultProfile,week:[],shopping:{},locked:{},pantry:[],favorites:[],version:2}; state.profile={...defaultProfile,...state.profile}; state.pantry=state.pantry||[];state.favorites=state.favorites||[];state.shopping=state.shopping||{}; state.customRecipes=state.customRecipes||[]; let recipes=[...builtInRecipes,...(state.customRecipes||[])];
function save(){localStorage.setItem('mealPlannerState',JSON.stringify(state))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function escape(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function suitable(r,slot){let d=(state.profile.dislikes||'').toLowerCase();return !d.split(',').some(x=>x.trim()&&r.name.toLowerCase().includes(x.trim())) && r.cat===slot}
function recipeAllowed(r){
 const p=state.profile, avoid=(p.dislikes||'').toLowerCase().split(',').map(x=>x.trim()).filter(Boolean), hay=(r.name+' '+r.ings.map(x=>x[0]).join(' ')).toLowerCase();
 if(avoid.some(x=>hay.includes(x)))return false;
 if(p.diet==='Vegan' && /egg|yoghurt|milk|cottage cheese|chicken|beef|tuna|pork|turkey/i.test(r.ings.map(x=>x[0]).join(' ')))return false;
 if(p.diet==='Vegetarian' && /chicken|beef|tuna|pork|turkey/i.test(r.ings.map(x=>x[0]).join(' ')))return false;
 const custom=(p.custom||'').toLowerCase(); if(custom.includes('no fish') && /tuna/i.test(hay))return false;
 return true;
}
function generateWeek(){
 const baseDays=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];const count=Math.max(1,Math.min(14,+state.profile.days||7));const days=Array.from({length:count},(_,i)=>i<7?baseDays[i]:`${baseDays[i-7]} (Week 2)`);
 const groups={Breakfast:recipes.filter(r=>r.cat==='Breakfast'&&recipeAllowed(r)),Lunch:recipes.filter(r=>r.cat==='Lunch'&&recipeAllowed(r)),Dinner:recipes.filter(r=>r.cat==='Dinner'&&recipeAllowed(r)),Snack:recipes.filter(r=>r.cat==='Snack'&&recipeAllowed(r))};
 const used={}; const choose=(cat,dayIndex,slotIndex)=>{let pool=groups[cat]||[];if(!pool.length)pool=recipes.filter(r=>r.cat===cat);let likes=(state.profile.likes||'').toLowerCase().split(',').map(x=>x.trim()).filter(Boolean);let priority=state.profile.priority||'Balanced';let scored=pool.map(r=>{let score=Math.random()*3;const hay=(r.name+' '+r.ings.map(x=>x[0]).join(' ')).toLowerCase();if(likes.some(x=>x&&hay.includes(x)))score+=2;if(state.profile.avoidRepeat!==false)score-=(used[r.id]||0)*5;if(priority==='Cheapest')score-=r.cost*2;if(priority==='Protein value')score+=r.p/Math.max(.1,r.cost);if(state.profile.mealPrep||state.profile.batch)score+=(used[r.id]||0)*1.3;return {r,score}}).sort((a,b)=>b.score-a.score);let r=scored[0].r;used[r.id]=(used[r.id]||0)+1;return r};
 const mealCount=+state.profile.meals||3;
 state.week=days.map((day,i)=>{let slots=mealCount===2?['Lunch','Dinner']:mealCount===3?['Breakfast','Lunch','Dinner']:['Breakfast','Lunch','Dinner','Snack'];let meals=slots.map((cat,j)=>choose(cat,i,j));return {day,meals:meals.map(r=>r.id)}});
 save();renderAll();toast('New plan generated')
}
function getRecipe(id){return recipes.find(r=>r.id===id)||recipes[0]}
function totals(day){let rs=state.week.find(d=>d.day===day)?.meals.map(getRecipe)||[];return {kcal:rs.reduce((a,r)=>a+r.kcal,0),p:rs.reduce((a,r)=>a+r.p,0)}}
function mealCard(r,day,idx){return `<div class="card"><div class="meal"><div class="meal-icon">${r.icon}</div><div class="meal-main"><div class="meal-name">${r.name}</div><div class="meal-meta">${r.kcal} kcal · ${r.p}g protein · £${r.cost.toFixed(2)}</div></div><div class="meal-actions"><button onclick="swapMeal('${day}',${idx})">Swap</button><button onclick="showRecipe('${r.id}')">Recipe</button></div></div></div>`}
function renderHome(){let today=new Date().getDay();let idx=(today+6)%7;let d=state.week[idx];if(!d){generateWeek();return}let t=totals(d.day);document.getElementById('home').innerHTML=`<div class="hero"><h1>${d.day}'s plan</h1><p>Targets: ${state.profile.calories} kcal and ${state.profile.protein}g protein.</p><div class="stats"><div class="stat"><b>${t.kcal}</b><span>kcal</span></div><div class="stat"><b>${t.p}g</b><span>protein</span></div><div class="stat"><b>£${d.meals.map(getRecipe).reduce((a,r)=>a+r.cost,0).toFixed(2)}</b><span>estimated</span></div></div><p class="sub">${Math.round(t.kcal/state.profile.calories*100)}% of calorie target · ${Math.round(t.p/state.profile.protein*100)}% of protein target</p></div><div class="actions"><button class="btn" onclick="generateWeek()">Generate plan</button><button class="btn secondary" onclick="showTab('shop')">Shopping list</button></div><div class="section-title">Today's meals</div>${d.meals.map((id,i)=>mealCard(getRecipe(id),d.day,i)).join('')}`}
function renderWeek(){if(!state.week.length){generateWeek();return}let prep='';if(state.profile.batch||state.profile.mealPrep){let counts={};state.week.forEach(d=>d.meals.forEach(id=>counts[id]=(counts[id]||0)+1));let repeated=Object.entries(counts).filter(([id,n])=>n>1).map(([id,n])=>`<li><b>${getRecipe(id).name}</b> — prepare ${n*(+state.profile.people||1)} portions across the plan</li>`).join('');prep=`<div class="card"><h3>🍱 Meal-prep plan</h3><p class="sub">Prepare repeated recipes together to save time. Cool food promptly, refrigerate portions for the next few days and freeze later portions.</p>${repeated?`<ul>${repeated}</ul>`:'<p class="sub">This plan has no repeated recipes yet; use the recipe buttons to choose meals you would like to batch-cook.</p>'}</div>`}document.getElementById('week').innerHTML=`<div class="actions"><button class="btn" onclick="generateWeek()">Generate new plan</button></div>${prep}${state.week.map(d=>{let t=totals(d.day);let pct=Math.min(100,Math.round(t.kcal/state.profile.calories*100));return `<div class="day-head"><h3>${d.day}</h3><span class="pill">${t.kcal} kcal · ${t.p}g P</span></div><div class="progress"><i style="width:${pct}%"></i></div>${d.meals.map((id,i)=>mealCard(getRecipe(id),d.day,i)).join('')}`}).join('')}`}
function buildShopping(){let map={};for(const d of state.week)for(const id of d.meals)for(const [n,q,u] of getRecipe(id).ings){let k=n;if(!map[k])map[k]={q:0,u,c:category(n)};map[k].q+=q*(+state.profile.people||1)}for(const x of state.pantry){if(map[x.name])map[x.name].q=Math.max(0,map[x.name].q-(+x.qty||0))}return Object.fromEntries(Object.entries(map).filter(([k,v])=>v.q>0))}
function category(n){if(/chicken|beef|tuna|egg/i.test(n))return 'Protein';if(/yoghurt|cottage/i.test(n))return 'Dairy';if(/rice|pasta|oat|bread|potato|bean/i.test(n))return 'Carbs & cupboard';if(/berry|banana|tomato|pepper|vegetable|salad|sweetcorn/i.test(n))return 'Fruit & veg';return 'Other'}
function renderShop(){let m=buildShopping();let cats={};Object.entries(m).forEach(([n,x])=>(cats[x.c]??=[]).push([n,x]));let checked=Object.values(state.shopping).filter(Boolean).length;document.getElementById('shop').innerHTML=`<div class="hero"><h1>Shopping list</h1><p>Consolidated across your ${state.week.length}-day plan. Tick items off as you shop.</p><div class="stats"><div class="stat"><b>${Object.keys(m).length}</b><span>items to buy</span></div><div class="stat"><b>${checked}</b><span>checked off</span></div><div class="stat"><b>£${(+state.profile.budget||45).toFixed(0)}</b><span>weekly budget</span></div></div></div>${Object.entries(cats).map(([c,items])=>`<div class="category">${c}</div><div class="card">${items.map(([n,x])=>`<label class="shop-row"><input type="checkbox" ${state.shopping[n]?'checked':''} onchange="toggleShoppingItem('${escape(n)}',this.checked)"><span class="name" style="${state.shopping[n]?'text-decoration:line-through;color:#888':''}">${escape(n)}</span><span class="qty">${fmt(x.q)} ${x.u}</span></label>`).join('')}</div>`).join('')||'<div class="empty">Generate a meal plan to build your shopping list.</div>'}<div class="actions"><button class="btn secondary" onclick="clearShoppingChecks()">Uncheck all</button><button class="btn secondary" onclick="window.print()">Print / save list</button></div><p class="sub">Quantities account for your servings and pantry inventory where ingredient names match. Prices are estimates, not live supermarket prices.</p>`}function toggleShoppingItem(name,checked){state.shopping[name]=checked;save();renderShop()}function clearShoppingChecks(){state.shopping={};save();renderShop()}
function fmt(n){return Number.isInteger(n)?n:(Math.round(n*10)/10)}
function presetButtons(key, values, current, suffix=''){return `<div class="checkrow presets">${values.map(v=>`<button type="button" class="chip ${+current===v?'on':''}" onclick="setPreset('${key}',${v})">${v}${suffix}</button>`).join('')}</div>`}
function choiceButtons(key, values, current){return `<div class="checkrow presets">${values.map(v=>`<button type="button" class="chip ${current===v?'on':''}" onclick="setChoice('${key}','${v}')">${v}</button>`).join('')}</div>`}
function renderProfile(){let p=state.profile;document.getElementById('profile').innerHTML=`<div class="section-title">Planner settings</div><div class="card"><div class="grid"><div class="field"><label>Daily calories</label><input id="cal" type="number" value="${p.calories}">${presetButtons('calories',[1600,1800,2000,2200,2500],p.calories)}</div><div class="field"><label>Protein (g)</label><input id="pro" type="number" value="${p.protein}">${presetButtons('protein',[100,150,180,200,220],p.protein,'g')}</div><div class="field"><label>Weekly budget (£)</label><input id="bud" type="number" value="${p.budget}">${presetButtons('budget',[25,35,45,50,60],p.budget,'£')}</div><div class="field"><label>Max cooking time</label><input id="cook" type="number" value="${p.cookTime}">${presetButtons('cookTime',[15,30,45,60],p.cookTime,' min')}</div><div class="field"><label>People / servings</label><input id="people" type="number" min="1" value="${p.people||1}">${presetButtons('people',[1,2,3,4,5],p.people||1)}</div><div class="field"><label>Plan length</label>${choiceButtons('days',[1,3,5,7,10,14].map(n=>`${n} day${n===1?'':'s'}`),`${p.days||7} day${(+p.days||7)===1?'':'s'}`)}</div><div class="field"><label>Meals per day</label>${choiceButtons('meals',['2','3','4'],String(p.meals||3))}</div><div class="field"><label>Planning priority</label>${choiceButtons('priority',['Balanced','Cheapest','Protein value','Variety'],p.priority||'Balanced')}</div></div><div class="field"><label>Supermarkets</label><div class="checkrow">${['Lidl','Aldi','Asda','Tesco','Sainsbury’s','Morrisons','Waitrose','Ocado','Iceland','Co-op'].map(s=>`<button class="chip ${(p.supermarkets||[]).includes(s)?'on':''}" onclick="toggleShop('${s}')">${s}</button>`).join('')}</div></div><div class="field"><label>Dietary preference</label>${choiceButtons('diet',['No restrictions','Vegetarian','Vegan'],p.diet||'No restrictions')}</div><div class="field"><label>Foods to avoid (comma separated)</label><input id="dis" value="${escape(p.dislikes)}" placeholder="e.g. mushrooms, olives"></div><div class="field"><label>Foods you like</label><textarea id="likes">${escape(p.likes)}</textarea></div><div class="field"><label>Goals</label><div class="checkrow">${['Lose weight','Gain muscle','Eat healthy','Save money','Make cooking easier'].map(g=>`<button type="button" class="chip ${(Array.isArray(p.goal)?p.goal:String(p.goal||'').split(',').map(x=>x.trim())).includes(g)?'on':''}" data-goal="${g}" onclick="toggleGoal('${g}')">${g}</button>`).join('')}</div></div><div class="field"><label>Extra instructions</label><textarea id="custom" placeholder="e.g. no fish this week">${escape(p.custom||'')}</textarea></div><div class="field"><label>Cooking style</label><div class="checkrow"><button class="chip ${p.batch?'on':''}" onclick="togglePref('batch')">Batch cooking</button><button class="chip ${p.mealPrep?'on':''}" onclick="togglePref('mealPrep')">Meal prep in advance</button><button class="chip ${p.leftovers!==false?'on':''}" onclick="togglePref('leftovers')">Use leftovers</button><button class="chip ${p.minWaste!==false?'on':''}" onclick="togglePref('minWaste')">Minimise waste</button><button class="chip ${p.avoidRepeat!==false?'on':''}" onclick="togglePref('avoidRepeat')">Avoid repetition</button></div><p class="sub">Meal prep prioritises recipes that can be prepared in batches and portioned for later meals. Refrigerate short-term portions and freeze what you won’t eat soon.</p></div><div class="actions"><button class="btn" onclick="saveProfile()">Save & regenerate</button><button class="btn secondary" onclick="backupData()">Export backup</button><button class="btn secondary" onclick="document.getElementById('restoreFile').click()">Import backup</button><input id="restoreFile" type="file" accept="application/json" style="display:none" onchange="restoreData(event)"></div></div><div class="notice">Saved locally on this device. Costs are estimates, not live supermarket prices. AI generation, automatic TikTok recipe extraction and cross-device sync are not connected in this version. Use the Recipes tab to add and review your own recipes.</div>`}
function setPreset(key,value){state.profile[key]=value;save();renderProfile()}
function setChoice(key,value){if(key==='days')state.profile.days=parseInt(value);else if(key==='meals')state.profile.meals=parseInt(value);else state.profile[key]=value;save();renderProfile()}

function saveProfile(){let p=state.profile;p.calories=+document.getElementById('cal').value||2000;p.protein=+document.getElementById('pro').value||200;p.budget=+document.getElementById('bud').value||45;p.cookTime=+document.getElementById('cook').value||45;p.people=+document.getElementById('people').value||1;p.custom=document.getElementById('custom').value;p.dislikes=document.getElementById('dis').value;p.likes=document.getElementById('likes').value;p.goal=[...document.querySelectorAll('[data-goal].on')].map(b=>b.dataset.goal);save();generateWeek()}
function toggleGoal(g){let p=state.profile;let a=Array.isArray(p.goal)?[...p.goal]:String(p.goal||'').split(',').map(x=>x.trim()).filter(Boolean);p.goal=a.includes(g)?a.filter(x=>x!==g):[...a,g];document.querySelectorAll('[data-goal]').forEach(b=>b.classList.toggle('on',p.goal.includes(b.dataset.goal)));save()}
function toggleShop(s){let a=state.profile.supermarkets;a.includes(s)?state.profile.supermarkets=a.filter(x=>x!==s):a.push(s);save();renderProfile()}
function swapMeal(day,idx){let d=state.week.find(x=>x.day===day);let current=getRecipe(d.meals[idx]);let candidates=recipes.filter(r=>r.cat===current.cat&&r.id!==current.id&&!((state.profile.dislikes||'').toLowerCase().split(',').some(x=>x.trim()&&r.name.toLowerCase().includes(x.trim()))));d.meals[idx]=pick(candidates).id;save();renderAll();toast('Meal swapped')}
function showRecipe(id){let r=getRecipe(id);document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>${r.icon} ${r.name}</h2><p class="sub">${r.kcal} kcal · ${r.p}g protein · about £${r.cost.toFixed(2)}</p><h3>Ingredients</h3>${r.ings.map(x=>`<div class="recipe-ing"><span>${escape(x[0])}</span><b>${x[1]} ${x[2]}</b></div>`).join('')}<h3>Method</h3><p>${escape(r.method||'Prep all ingredients. Cook the protein thoroughly, add vegetables and seasonings, then combine with the carbohydrate component. For batch cooking, divide evenly into containers and refrigerate or freeze portions promptly.')}</p>${r.source?`<p><a href="${escape(r.source)}" target="_blank" rel="noopener">Open original recipe source ↗</a></p>`:''}<button class="btn" onclick="closeModal()">Done</button>`;document.getElementById('modal').style.display='flex'}

function togglePref(k){state.profile[k]=!state.profile[k];save();renderProfile()}
function backupData(){downloadFile('meal-planner-backup.json',JSON.stringify(state,null,2),'application/json')}
function restoreData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);state.profile={...defaultProfile,...state.profile};state.pantry=state.pantry||[];state.favorites=state.favorites||[];save();renderAll();toast('Backup imported')}catch(x){toast('Invalid backup file')}};r.readAsText(f)}
function downloadFile(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function addPantry(){let name=document.getElementById('pantryName').value.trim(),qty=+document.getElementById('pantryQty').value,unit=document.getElementById('pantryUnit').value,place=document.getElementById('pantryPlace').value;if(!name||qty<=0){toast('Enter ingredient and quantity');return}state.pantry.push({name,qty,unit,place});save();renderPantry();renderShop();toast('Inventory updated')}
function removePantry(i){state.pantry.splice(i,1);save();renderPantry();renderShop()}
function renderPantry(){document.getElementById('pantry').innerHTML=`<div class="section-title">Pantry, fridge & freezer</div><div class="card"><div class="grid"><div class="field"><label>Ingredient</label><input id="pantryName" placeholder="e.g. Rice"></div><div class="field"><label>Quantity</label><input id="pantryQty" type="number" min="0" placeholder="e.g. 500"></div></div><div class="grid"><div class="field"><label>Unit</label><select id="pantryUnit"><option>g</option><option>kg</option><option>ml</option><option>pieces</option><option>portions</option></select></div><div class="field"><label>Storage</label><select id="pantryPlace"><option>Pantry</option><option>Fridge</option><option>Freezer</option></select></div></div><button class="btn" onclick="addPantry()">Add item</button></div><div class="section-title">Inventory</div>${state.pantry.map((x,i)=>`<div class="card"><b>${escape(x.name)}</b><p class="sub">${x.qty} ${escape(x.unit)} · ${escape(x.place)}</p><button class="btn small secondary" onclick="removePantry(${i})">Remove</button></div>`).join('')||'<div class="empty">Nothing added yet.</div>'}<div class="notice">Inventory is saved on this device. Ingredient names and units should match recipe ingredients for accurate shopping-list deductions.</div>`}

function renderRecipes(){
 const customCount=state.customRecipes.length;
 document.getElementById('recipes').innerHTML=`<div class="section-title">Recipe library</div><div class="hero"><h1>🍽️ ${recipes.length} recipes</h1><p>A growing library of meals, plus recipes you add yourself. Nutrition and costs are estimates unless you verify them.</p><div class="stats"><div class="stat"><b>${builtInRecipes.length}</b><span>built-in recipes</span></div><div class="stat"><b>${customCount}</b><span>your recipes</span></div><div class="stat"><b>${state.favorites.length}</b><span>favourites</span></div></div></div><div class="actions"><button class="btn" onclick="openAddRecipe()">＋ Add a recipe</button><button class="btn secondary" onclick="showTab('week')">Back to plan</button></div><div class="field"><label>Search recipes</label><input id="recipeSearch" placeholder="Search by meal or ingredient" oninput="filterRecipes()"></div><div id="recipeResults">${recipeListHtml(recipes)}</div>`;
}
function recipeListHtml(list){return list.map(r=>`<div class="card"><div class="meal"><div class="meal-icon">${r.icon||'🍽️'}</div><div class="meal-main"><div class="meal-name">${escape(r.name)}</div><div class="meal-meta">${escape(r.cat)} · ${r.kcal} kcal · ${r.p}g protein · ~£${(+r.cost||0).toFixed(2)}</div></div><div class="meal-actions"><button onclick="toggleFavorite('${r.id}')">${state.favorites.includes(r.id)?'♥':'♡'}</button><button onclick="showRecipe('${r.id}')">View</button></div></div></div>`).join('')||'<div class="empty">No recipes match that search.</div>'}
function filterRecipes(){let q=(document.getElementById('recipeSearch')?.value||'').toLowerCase();document.getElementById('recipeResults').innerHTML=recipeListHtml(recipes.filter(r=>(r.name+' '+r.cat+' '+r.ings.map(i=>i[0]).join(' ')).toLowerCase().includes(q)))}
function toggleFavorite(id){state.favorites=state.favorites||[];state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();renderRecipes()}
function openAddRecipe(){document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>Add your own recipe</h2><p class="sub">Paste a TikTok link to save its source. TikTok may expose only a title/description; for reliable recipe extraction, paste the caption or recipe text below and check everything before saving.</p><div class="field"><label>TikTok / recipe URL (optional)</label><input id="newSource" placeholder="https://www.tiktok.com/@creator/video/…"></div><button class="btn secondary" onclick="lookupTikTok()">Try to fetch TikTok title</button><div class="field"><label>Recipe name *</label><input id="newName" placeholder="e.g. High-protein chicken orzo"></div><div class="field"><label>Paste caption, ingredients or recipe text</label><textarea id="newNotes" rows="4" placeholder="Paste the creator's caption or recipe instructions here"></textarea></div><div class="grid"><div class="field"><label>Meal type</label><select id="newCat"><option>Breakfast</option><option>Lunch</option><option selected>Dinner</option><option>Snack</option></select></div><div class="field"><label>Icon</label><select id="newIcon"><option>🍽️</option><option>🥣</option><option>🍳</option><option>🥗</option><option>🍝</option><option>🍛</option><option>🌯</option><option>🍗</option><option>🍜</option><option>🥔</option></select></div></div><div class="grid"><div class="field"><label>Calories / serving</label><input id="newKcal" type="number" min="0" placeholder="e.g. 520"></div><div class="field"><label>Protein g / serving</label><input id="newProtein" type="number" min="0" placeholder="e.g. 45"></div><div class="field"><label>Estimated cost £ / serving</label><input id="newCost" type="number" min="0" step="0.05" placeholder="e.g. 1.80"></div><div class="field"><label>Servings in recipe</label><input id="newServings" type="number" min="1" value="1"></div></div><div class="field"><label>Ingredients (one per line: name | quantity | unit)</label><textarea id="newIngredients" rows="5" placeholder="Chicken breast | 180 | g&#10;Rice | 60 | g&#10;Broccoli | 150 | g"></textarea></div><div class="field"><label>Cooking method</label><textarea id="newMethod" rows="4" placeholder="Paste or write the cooking steps"></textarea></div><button class="btn" onclick="saveNewRecipe()">Save recipe to my library</button><p class="sub">Nothing is added until you review and save it. Nutrition values are not automatically verified from TikTok.</p>`;document.getElementById('modal').style.display='flex'}
async function lookupTikTok(){const url=document.getElementById('newSource').value.trim();if(!url){toast('Paste a TikTok link first');return}if(!/tiktok\.com\//i.test(url)){toast('Please use a TikTok URL');return}try{const res=await fetch('https://www.tiktok.com/oembed?url='+encodeURIComponent(url));if(!res.ok)throw new Error('TikTok metadata unavailable');const data=await res.json();const title=(data.title||'').replace(/\s+/g,' ').trim();if(title&&!document.getElementById('newName').value)document.getElementById('newName').value=title.slice(0,100);const notes=document.getElementById('newNotes');if(data.title&&!notes.value)notes.value='TikTok title/caption: '+data.title;toast('Title loaded — review and complete the recipe')}catch(e){toast('TikTok blocked automatic lookup here. Paste the caption/recipe text manually.')}}
function saveNewRecipe(){const name=document.getElementById('newName').value.trim();if(!name){toast('Please add a recipe name');return}const source=document.getElementById('newSource').value.trim();const raw=document.getElementById('newIngredients').value.split(/\n/).map(x=>x.trim()).filter(Boolean);let ings=[];for(const line of raw){const parts=line.split('|').map(x=>x.trim());const qty=parseFloat(parts[1]);if(parts[0])ings.push([parts[0],Number.isFinite(qty)?qty:1,parts[2]||'portion'])}if(!ings.length){const note=document.getElementById('newNotes').value.trim();if(note){const lines=note.split(/\n|,|;/).map(x=>x.trim()).filter(x=>x.length>2&&x.length<70&&!/^(ingredients|method|directions|instructions|recipe)\b/i.test(x));ings=lines.slice(0,12).map(x=>[x,1,'portion'])}}if(!ings.length){toast('Add at least one ingredient line');return}const id='user_'+Date.now();const r={id,name,icon:document.getElementById('newIcon').value,cat:document.getElementById('newCat').value,kcal:+document.getElementById('newKcal').value||0,p:+document.getElementById('newProtein').value||0,c:0,f:0,cost:+document.getElementById('newCost').value||0,ings,source,method:document.getElementById('newMethod').value.trim()||document.getElementById('newNotes').value.trim()||'Add cooking steps when you have them.',servings:+document.getElementById('newServings').value||1,custom:true};state.customRecipes.push(r);recipes.push(r);save();closeModal();renderRecipes();toast('Recipe added to your library')}

function showTab(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));if(id==='home')renderHome();if(id==='week')renderWeek();if(id==='shop')renderShop();if(id==='pantry')renderPantry();if(id==='recipes')renderRecipes();if(id==='profile')renderProfile()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function renderAll(){renderHome();renderWeek();renderShop();renderPantry();renderRecipes();renderProfile()}
if(!state.week.length)generateWeek();else renderAll();
</script></body></html>
