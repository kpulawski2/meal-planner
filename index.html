<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Meal Planner">
<link rel="manifest" href="manifest.webmanifest">
<title>Meal Planner</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--text:#171717;--muted:#747474;--line:#e7e7e2;--accent:#111;--green:#1f7a4d;--danger:#a33}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{border:0}.app{max-width:760px;margin:auto;padding-bottom:90px}.top{padding:calc(18px + env(safe-area-inset-top)) 18px 14px;background:var(--bg);position:sticky;top:0;z-index:4}.brand{font-size:27px;font-weight:750}.sub{color:var(--muted);font-size:13px;margin-top:3px}.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom))}.tabs button{background:none;color:#777;padding:7px 14px;border-radius:12px;font-size:12px}.tabs button.active{background:#111;color:white}.screen{display:none;padding:8px 16px}.screen.active{display:block}.hero{background:#111;color:#fff;border-radius:24px;padding:20px;margin:4px 0 14px}.hero h1{margin:0 0 6px;font-size:25px}.hero p{margin:0;color:#cfcfcf}.stats{display:flex;gap:10px;margin-top:18px}.stat{background:#1f1f1f;border-radius:14px;padding:11px 12px;flex:1}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:#aaa}.actions{display:flex;gap:9px;margin:12px 0}.btn{padding:12px 15px;border-radius:13px;background:#111;color:white;font-weight:650;cursor:pointer}.btn.secondary{background:#fff;color:#111;border:1px solid var(--line)}.btn.small{padding:9px 11px;font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}.section-title{font-weight:750;margin:18px 2px 8px}.meal{display:flex;gap:12px;align-items:center}.meal-icon{width:48px;height:48px;border-radius:14px;background:#f0f0ec;display:grid;place-items:center;font-size:24px}.meal-main{flex:1}.meal-name{font-weight:700}.meal-meta{font-size:12px;color:var(--muted);margin-top:4px}.meal-actions{display:flex;gap:6px}.meal-actions button{background:#f3f3ef;border-radius:9px;padding:7px 9px;font-size:11px}.day-head{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 6px}.day-head h3{margin:0;font-size:18px}.pill{font-size:11px;background:#ecece7;border-radius:99px;padding:6px 9px}.progress{height:8px;background:#e8e8e3;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;background:#111;border-radius:99px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checkrow{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:9px 11px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:12px}.chip.on{background:#111;color:#fff;border-color:#111}.shop-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.shop-row:last-child{border-bottom:0}.shop-row input{width:19px;height:19px}.shop-row .name{flex:1}.qty{font-size:12px;color:var(--muted)}.category{font-weight:750;font-size:13px;margin:18px 0 3px}.empty{text-align:center;color:var(--muted);padding:35px 10px}.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:11px 15px;border-radius:99px;font-size:12px;display:none;z-index:20}.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:end;z-index:30}.sheet{background:#fff;border-radius:25px 25px 0 0;width:100%;max-width:760px;margin:auto;padding:20px;max-height:82vh;overflow:auto}.sheet h2{margin:0 0 5px}.close{float:right;background:#eee;border-radius:50%;width:32px;height:32px}.recipe-ing{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
@media(min-width:760px){.tabs{position:sticky;bottom:auto;border:0;background:transparent;justify-content:flex-start;padding:8px 16px}.app{box-shadow:0 0 35px #ddd;min-height:100vh}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand">Meal Planner</div><div class="sub">Your personal mise-style planner</div></header>
<section id="home" class="screen active"></section><section id="week" class="screen"></section><section id="shop" class="screen"></section><section id="profile" class="screen"></section>
<nav class="tabs"><button data-tab="home" class="active">Today</button><button data-tab="week">Week</button><button data-tab="shop">Shop</button><button data-tab="profile">Profile</button></nav></div><div id="toast" class="toast"></div><div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<script>
const defaultProfile={calories:2000,protein:200,budget:45,supermarkets:['Lidl','Asda'],meals:4,cookTime:45,batch:true,people:1,dislikes:'',likes:'chicken, beef, rice, potato, salad',goal:'Lose weight, gain muscle, eat healthy, save money, make cooking easier'};
const recipes=[
{id:'breakfast',name:'Protein Berry Yoghurt Bowl',icon:'🥣',kcal:430,p:50,c:42,f:7,cost:1.15,cat:'Breakfast',ings:[['0% Greek yoghurt',400,'g'],['Oats',30,'g'],['Frozen berries',100,'g'],['Eggs',2,''],['Cinnamon',1,' tsp']]},
{id:'eggs',name:'Protein Eggs & Toast',icon:'🍳',kcal:450,p:42,c:34,f:14,cost:1.25,cat:'Breakfast',ings:[['Eggs',3,''],['Wholemeal bread',2,'slices'],['0% Greek yoghurt',200,'g'],['Tomato',100,'g']]},
{id:'fajita',name:'Chicken Fajita Rice Bowl',icon:'🌯',kcal:570,p:59,c:59,f:10,cost:1.85,cat:'Lunch',ings:[['Chicken breast',200,'g'],['Rice',50,'g'],['Frozen mixed peppers',200,'g'],['0% Greek yoghurt',50,'g'],['Cooking oil',5,'g'],['Fajita seasoning',1,'portion']]},
{id:'tuna',name:'Tuna Protein Pasta Salad',icon:'🍝',kcal:575,p:56,c:59,f:9,cost:1.55,cat:'Lunch',ings:[['Tuna',145,'g'],['Pasta',60,'g'],['0% Greek yoghurt',100,'g'],['Sweetcorn',80,'g'],['Mixed salad',100,'g'],['Eggs',1,'']]},
{id:'chickencurry',name:'Chicken Curry & Rice',icon:'🍛',kcal:610,p:61,c:57,f:12,cost:1.75,cat:'Dinner',ings:[['Chicken breast',200,'g'],['Rice',50,'g'],['Chopped tomatoes',200,'g'],['Frozen mixed vegetables',150,'g'],['0% Greek yoghurt',50,'g'],['Cooking oil',5,'g'],['Curry powder',1,'portion']]},
{id:'chillipotato',name:'Lean Beef Chilli Potato',icon:'🥩',kcal:650,p:58,c:65,f:15,cost:2.05,cat:'Dinner',ings:[['5% beef mince',180,'g'],['Potato',200,'g'],['Kidney beans',120,'g'],['Chopped tomatoes',150,'g'],['Frozen mixed vegetables',100,'g'],['0% Greek yoghurt',50,'g'],['Cooking oil',5,'g']]},
{id:'beefrice',name:'Beef & Pepper Rice Bowl',icon:'🍚',kcal:625,p:55,c:61,f:15,cost:2.15,cat:'Dinner',ings:[['5% beef mince',180,'g'],['Rice',55,'g'],['Frozen mixed peppers',200,'g'],['Chopped tomatoes',100,'g'],['0% Greek yoghurt',50,'g']]},
{id:'snack',name:'Cottage Cheese & Banana',icon:'🍌',kcal:260,p:25,c:30,f:4,cost:.8,cat:'Snack',ings:[['Cottage cheese',200,'g'],['Banana',1,'']]},
{id:'proteinpud',name:'Yoghurt Protein Pudding',icon:'🥛',kcal:220,p:27,c:22,f:3,cost:.75,cat:'Snack',ings:[['0% Greek yoghurt',250,'g'],['Frozen berries',100,'g'],['Cocoa powder',5,'g']]}
];
let state=JSON.parse(localStorage.getItem('mealPlannerState')||'null')||{profile:defaultProfile,week:[],shopping:{},locked:{},version:1};
function save(){localStorage.setItem('mealPlannerState',JSON.stringify(state))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function escape(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function suitable(r,slot){let d=(state.profile.dislikes||'').toLowerCase();return !d.split(',').some(x=>x.trim()&&r.name.toLowerCase().includes(x.trim())) && r.cat===slot}
function generateWeek(){
 const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
 const breakfast=recipes.filter(r=>r.cat==='Breakfast'), lunch=recipes.filter(r=>r.cat==='Lunch'), dinner=recipes.filter(r=>r.cat==='Dinner'), snack=recipes.filter(r=>r.cat==='Snack');
 state.week=days.map((day,i)=>{let meals=[];let choose=(arr,offset)=>arr[(i+offset)%arr.length]; meals.push(choose(breakfast,0),choose(lunch,i%2),choose(dinner,i%3),choose(snack,i%2));return {day,meals:meals.map(r=>r.id)}});
 save();renderAll();toast('New week generated')
}
function getRecipe(id){return recipes.find(r=>r.id===id)}
function totals(day){let rs=state.week.find(d=>d.day===day)?.meals.map(getRecipe)||[];return {kcal:rs.reduce((a,r)=>a+r.kcal,0),p:rs.reduce((a,r)=>a+r.p,0)}}
function mealCard(r,day,idx){return `<div class="card"><div class="meal"><div class="meal-icon">${r.icon}</div><div class="meal-main"><div class="meal-name">${r.name}</div><div class="meal-meta">${r.kcal} kcal · ${r.p}g protein · £${r.cost.toFixed(2)}</div></div><div class="meal-actions"><button onclick="swapMeal('${day}',${idx})">Swap</button><button onclick="showRecipe('${r.id}')">Recipe</button></div></div></div>`}
function renderHome(){let today=new Date().getDay();let idx=(today+6)%7;let d=state.week[idx];if(!d){generateWeek();return}let t=totals(d.day);document.getElementById('home').innerHTML=`<div class="hero"><h1>${d.day}'s plan</h1><p>Built around ${state.profile.calories} kcal and ${state.profile.protein}g protein.</p><div class="stats"><div class="stat"><b>${t.kcal}</b><span>kcal</span></div><div class="stat"><b>${t.p}g</b><span>protein</span></div><div class="stat"><b>£${d.meals.map(getRecipe).reduce((a,r)=>a+r.cost,0).toFixed(2)}</b><span>estimated</span></div></div></div><div class="actions"><button class="btn" onclick="generateWeek()">Generate week</button><button class="btn secondary" onclick="showTab('shop')">Shopping list</button></div><div class="section-title">Today's meals</div>${d.meals.map((id,i)=>mealCard(getRecipe(id),d.day,i)).join('')}`}
function renderWeek(){if(!state.week.length){generateWeek();return}document.getElementById('week').innerHTML=`<div class="actions"><button class="btn" onclick="generateWeek()">Generate new week</button></div>${state.week.map(d=>{let t=totals(d.day);let pct=Math.min(100,Math.round(t.kcal/state.profile.calories*100));return `<div class="day-head"><h3>${d.day}</h3><span class="pill">${t.kcal} kcal · ${t.p}g P</span></div><div class="progress"><i style="width:${pct}%"></i></div>${d.meals.map((id,i)=>mealCard(getRecipe(id),d.day,i)).join('')}`}).join('')}`}
function buildShopping(){let map={};for(const d of state.week)for(const id of d.meals)for(const [n,q,u] of getRecipe(id).ings){let k=n;if(!map[k])map[k]={q:0,u,c:category(n)};map[k].q+=q}return map}
function category(n){if(/chicken|beef|tuna|egg/i.test(n))return 'Protein';if(/yoghurt|cottage/i.test(n))return 'Dairy';if(/rice|pasta|oat|bread|potato|bean/i.test(n))return 'Carbs & cupboard';if(/berry|banana|tomato|pepper|vegetable|salad|sweetcorn/i.test(n))return 'Fruit & veg';return 'Other'}
function renderShop(){let m=buildShopping();let cats={};Object.entries(m).forEach(([n,x])=>(cats[x.c]??=[]).push([n,x]));document.getElementById('shop').innerHTML=`<div class="hero"><h1>Shopping list</h1><p>Consolidated across your whole week to minimise duplicate ingredients.</p><div class="stats"><div class="stat"><b>${Object.keys(m).length}</b><span>items</span></div><div class="stat"><b>£40–50</b><span>target budget</span></div></div></div>${Object.entries(cats).map(([c,items])=>`<div class="category">${c}</div><div class="card">${items.map(([n,x])=>`<label class="shop-row"><input type="checkbox"><span class="name">${escape(n)}</span><span class="qty">${fmt(x.q)} ${x.u}</span></label>`).join('')}</div>`).join('')}<button class="btn secondary" onclick="window.print()">Print / save list</button>`}
function fmt(n){return Number.isInteger(n)?n:(Math.round(n*10)/10)}
function renderProfile(){let p=state.profile;document.getElementById('profile').innerHTML=`<div class="section-title">Your planner</div><div class="card"><div class="grid"><div class="field"><label>Daily calories</label><input id="cal" type="number" value="${p.calories}"></div><div class="field"><label>Protein (g)</label><input id="pro" type="number" value="${p.protein}"></div></div><div class="grid"><div class="field"><label>Weekly budget (£)</label><input id="bud" type="number" value="${p.budget}"></div><div class="field"><label>Max cooking time</label><input id="cook" type="number" value="${p.cookTime}"></div></div><div class="field"><label>Supermarkets</label><div class="checkrow"><button class="chip ${p.supermarkets.includes('Lidl')?'on':''}" onclick="toggleShop('Lidl')">Lidl</button><button class="chip ${p.supermarkets.includes('Asda')?'on':''}" onclick="toggleShop('Asda')">Asda</button></div></div><div class="field"><label>Foods you dislike (comma separated)</label><input id="dis" value="${escape(p.dislikes)}" placeholder="e.g. mushrooms, olives"></div><div class="field"><label>Foods you like</label><textarea id="likes">${escape(p.likes)}</textarea></div><div class="field"><label>Goals</label><textarea id="goal">${escape(p.goal)}</textarea></div><button class="btn" onclick="saveProfile()">Save profile</button></div><div class="card"><b>Current setup</b><p class="sub">1 person · 4 meals/day · high protein · batch cooking · minimal waste</p></div>`}
function saveProfile(){let p=state.profile;p.calories=+document.getElementById('cal').value;p.protein=+document.getElementById('pro').value;p.budget=+document.getElementById('bud').value;p.cookTime=+document.getElementById('cook').value;p.dislikes=document.getElementById('dis').value;p.likes=document.getElementById('likes').value;p.goal=document.getElementById('goal').value;save();toast('Profile saved');generateWeek()}
function toggleShop(s){let a=state.profile.supermarkets;a.includes(s)?state.profile.supermarkets=a.filter(x=>x!==s):a.push(s);save();renderProfile()}
function swapMeal(day,idx){let d=state.week.find(x=>x.day===day);let current=getRecipe(d.meals[idx]);let candidates=recipes.filter(r=>r.cat===current.cat&&r.id!==current.id&&!((state.profile.dislikes||'').toLowerCase().split(',').some(x=>x.trim()&&r.name.toLowerCase().includes(x.trim()))));d.meals[idx]=pick(candidates).id;save();renderAll();toast('Meal swapped')}
function showRecipe(id){let r=getRecipe(id);document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>${r.icon} ${r.name}</h2><p class="sub">${r.kcal} kcal · ${r.p}g protein · about £${r.cost.toFixed(2)}</p><h3>Ingredients</h3>${r.ings.map(x=>`<div class="recipe-ing"><span>${escape(x[0])}</span><b>${x[1]} ${x[2]}</b></div>`).join('')}<h3>Method</h3><p>Prep all ingredients. Cook the protein thoroughly, add vegetables and seasonings, then combine with the carbohydrate component. For batch cooking, divide evenly into containers and refrigerate or freeze portions promptly.</p><button class="btn" onclick="closeModal()">Done</button>`;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
function showTab(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));if(id==='home')renderHome();if(id==='week')renderWeek();if(id==='shop')renderShop();if(id==='profile')renderProfile()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function renderAll(){renderHome();renderWeek();renderShop();renderProfile()}
if(!state.week.length)generateWeek();else renderAll();
</script></body></html>
