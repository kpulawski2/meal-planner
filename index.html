<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.webmanifest">
<title>Meal Planner</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--text:#171717;--muted:#737373;--line:#e5e5df;--accent:#111;--good:#1f7a4d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;padding-bottom:95px}.top{padding:24px 18px 14px;position:sticky;top:0;background:rgba(245,245,242,.94);backdrop-filter:blur(18px);z-index:5}.brand{font-size:28px;font-weight:800}.sub{font-size:13px;color:var(--muted);margin-top:3px}.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding:8px}.tabs button{background:transparent;padding:9px 14px;border-radius:12px;color:#777}.tabs button.active{background:#111;color:#fff}.screen{display:none;padding:10px 16px}.screen.active{display:block}.hero{background:#111;color:#fff;border-radius:24px;padding:20px;margin-bottom:14px}.hero h1{margin:0 0 6px;font-size:25px}.hero p{margin:0;color:#ccc}.stats{display:flex;gap:9px;margin-top:18px}.stat{background:#202020;border-radius:14px;padding:11px;flex:1}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:#aaa}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{border:0;background:#111;color:#fff;border-radius:12px;padding:11px 14px;font-weight:700}.btn.secondary{background:#fff;color:#111;border:1px solid var(--line)}.btn.link{background:#f0f0eb;color:#111;text-decoration:none;display:inline-block}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}.section-title{font-weight:800;margin:18px 2px 7px}.meal{display:flex;gap:12px;align-items:center}.meal-icon{width:48px;height:48px;border-radius:14px;background:#f0f0eb;display:grid;place-items:center;font-size:24px}.meal-main{flex:1}.meal-name{font-weight:750}.meal-meta{font-size:12px;color:var(--muted);margin-top:4px}.meal-actions{display:flex;gap:5px}.meal-actions button{background:#f2f2ed;border-radius:9px;padding:7px;font-size:11px}.day{margin-top:20px}.day-head{display:flex;justify-content:space-between;align-items:center}.pill{background:#ecece7;border-radius:99px;padding:6px 9px;font-size:11px}.progress{height:7px;background:#e7e7e2;border-radius:99px;overflow:hidden;margin:7px 0}.progress i{display:block;height:100%;background:#111}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}.shop-row{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--line)}.shop-row:last-child{border:0}.shop-row .name{flex:1}.qty{font-size:12px;color:var(--muted)}.product{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.product-main{flex:1}.product-name{font-weight:700;font-size:13px}.product-meta{font-size:11px;color:var(--muted);margin-top:3px}.tag{display:inline-block;background:#eee;border-radius:99px;padding:5px 8px;font-size:10px;margin:3px}.search{margin-bottom:10px}.recipe-ing{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0;font-size:13px}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:30;align-items:flex-end}.sheet{background:#fff;border-radius:25px 25px 0 0;width:100%;max-width:900px;margin:auto;max-height:88vh;overflow:auto;padding:20px}.close{float:right;border:0;background:#eee;border-radius:50%;width:32px;height:32px}.muted{color:var(--muted)}.price{font-weight:800}.empty{padding:35px;text-align:center;color:var(--muted)}
@media(min-width:760px){.tabs{position:sticky;bottom:auto;border:0;background:transparent;justify-content:flex-start}.app{box-shadow:0 0 30px #ddd;min-height:100vh}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">Meal Planner</div><div class="sub">ASDA-powered planning · grams & ml · real product links</div></header>
<section id="home" class="screen active"></section>
<section id="week" class="screen"></section>
<section id="recipes" class="screen"></section>
<section id="shop" class="screen"></section>
<section id="profile" class="screen"></section>
<nav class="tabs">
<button data-tab="home" class="active">Today</button><button data-tab="week">Week</button><button data-tab="recipes">Recipes</button><button data-tab="shop">Shop</button><button data-tab="profile">Profile</button>
</nav>
</div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<script>
const DEFAULT={calories:2000,protein:200,budget:45,meals:4,people:1,dislikes:"",likes:"chicken, beef, rice, potato, salad",supermarket:"ASDA"};
let recipes=[],products=[],ingredients=[],state=JSON.parse(localStorage.getItem("mealPlannerV2")||"null")||{profile:DEFAULT,week:[]};
const $=id=>document.getElementById(id), save=()=>localStorage.setItem("mealPlannerV2",JSON.stringify(state));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number.isInteger(n)?n:(Math.round(n*10)/10);
const getR=id=>recipes.find(r=>r.id===id);
function dislike(r){let d=(state.profile.dislikes||"").toLowerCase().split(",").map(x=>x.trim()).filter(Boolean);return d.some(x=>r.name.toLowerCase().includes(x));}
function choose(a,i){return a.length?a[i%a.length]:null}
function generate(){
 const days=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
 const cats={Breakfast:recipes.filter(r=>r.category==="Breakfast"),Lunch:recipes.filter(r=>r.category==="Lunch"),Dinner:recipes.filter(r=>r.category==="Dinner"),Snack:recipes.filter(r=>r.category==="Snack")};
 state.week=days.map((day,i)=>({day,meals:[choose(cats.Breakfast.filter(r=>!dislike(r)),i),choose(cats.Lunch.filter(r=>!dislike(r)),i+2),choose(cats.Dinner.filter(r=>!dislike(r)),i+3),choose(cats.Snack.filter(r=>!dislike(r)),i)].filter(Boolean).map(r=>r.id)}));save();renderAll();
}
function totals(d){let rs=d.meals.map(getR);return {kcal:rs.reduce((a,r)=>a+r.kcal,0),p:rs.reduce((a,r)=>a+r.protein,0),cost:rs.reduce((a,r)=>a+recipeCost(r),0)}}
function findProduct(name){let n=name.toLowerCase();let exact=products.filter(p=>p.ingredient.toLowerCase()===n);if(exact.length)return exact[0];let hit=products.find(p=>p.name.toLowerCase().includes(n)||n.includes(p.ingredient.toLowerCase()));return hit||null}
function recipeCost(r){return r.ingredients.reduce((sum,i)=>{let p=findProduct(i.ingredient);if(!p)return sum;return sum+(p.price*(i.quantity/p.packQuantity));},0)}
function mealCard(r,d,i){return `<div class="card"><div class="meal"><div class="meal-icon">${r.icon}</div><div class="meal-main"><div class="meal-name">${esc(r.name)}</div><div class="meal-meta">${r.kcal} kcal · ${r.protein}g protein · ${r.totalMinutes} min · £${recipeCost(r).toFixed(2)} ingredient-use</div></div><div class="meal-actions"><button onclick="swap('${d}',${i})">Swap</button><button onclick="showRecipe('${r.id}')">Recipe</button></div></div></div>`}
function renderHome(){let idx=(new Date().getDay()+6)%7,d=state.week[idx];if(!d){generate();return}let t=totals(d);$("home").innerHTML=`<div class="hero"><h1>${d.day}'s plan</h1><p>${state.profile.calories} kcal target · ${state.profile.protein}g protein target · ASDA pricing</p><div class="stats"><div class="stat"><b>${t.kcal}</b><span>kcal</span></div><div class="stat"><b>${t.p}g</b><span>protein</span></div><div class="stat"><b>£${t.cost.toFixed(2)}</b><span>ingredient-use</span></div></div></div><div class="actions"><button class="btn" onclick="generate()">Generate week</button><button class="btn secondary" onclick="showTab('shop')">Shopping list</button></div><div class="section-title">Today's meals</div>${d.meals.map((id,i)=>mealCard(getR(id),d.day,i)).join("")}`}
function renderWeek(){$("week").innerHTML=`<div class="actions"><button class="btn" onclick="generate()">Generate new week</button></div>${state.week.map(d=>{let t=totals(d),pct=Math.min(100,Math.round(t.kcal/state.profile.calories*100));return `<div class="day"><div class="day-head"><h3>${d.day}</h3><span class="pill">${t.kcal} kcal · ${t.p}g P</span></div><div class="progress"><i style="width:${pct}%"></i></div>${d.meals.map((id,i)=>mealCard(getR(id),d.day,i)).join("")}</div>`}).join("")}`}
function swap(day,i){let d=state.week.find(x=>x.day===day),old=getR(d.meals[i]);let c=recipes.filter(r=>r.category===old.category&&r.id!==old.id&&!dislike(r));if(c.length)d.meals[i]=c[Math.floor(Math.random()*c.length)].id;save();renderAll()}
function showRecipe(id){let r=getR(id),ings=r.ingredients.map(i=>{let p=findProduct(i.ingredient);return `<div class="recipe-ing"><span>${esc(i.ingredient)}</span><b>${fmt(i.quantity)} ${i.unit}</b></div>${p?`<div class="product"><div class="product-main"><div class="product-name">${esc(p.name)}</div><div class="product-meta">${esc(p.packSize)} · checked ${esc(p.checked)}</div></div><span class="price">£${p.price.toFixed(2)}</span><a class="btn link" target="_blank" href="${esc(p.url)}">ASDA</a></div>`:""}`}).join("");$("sheet").innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>${r.icon} ${esc(r.name)}</h2><p class="muted">${r.kcal} kcal · ${r.protein}g protein · ${r.carbs}g carbs · ${r.fat}g fat · ${r.totalMinutes} min</p><p>${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</p><h3>Ingredients</h3>${ings}<h3>Method</h3><p>${esc(r.method)}</p><button class="btn" onclick="closeModal()">Done</button>`;$("modal").style.display="flex"}
function closeModal(){$("modal").style.display="none"}
function buildShop(){let map={};for(const d of state.week)for(const id of d.meals)for(const i of getR(id).ingredients){let k=i.ingredient;if(!map[k])map[k]={q:0,u:i.unit};map[k].q+=i.quantity}return map}
function renderShop(){let m=buildShop(),rows=Object.entries(m).map(([n,x])=>{let p=findProduct(n),packs=p?Math.ceil(x.q/p.packQuantity):0,cost=p?packs*p.price:0;return `<div class="card"><div class="shop-row"><input type="checkbox"><span class="name"><b>${esc(n)}</b><br><span class="qty">Need ${fmt(x.q)} ${x.u}</span></span>${p?`<span><b>${packs} ×</b> £${cost.toFixed(2)}</span>`:"<span class='qty'>No ASDA match yet</span>"}</div>${p?`<div class="product"><div class="product-main"><div class="product-name">${esc(p.name)}</div><div class="product-meta">${esc(p.packSize)} · £${p.price.toFixed(2)} · ${p.checked}</div></div><a class="btn link" target="_blank" href="${esc(p.url)}">View ASDA</a></div>`:""}</div>`}).join("");$("shop").innerHTML=`<div class="hero"><h1>ASDA shopping list</h1><p>Quantities are normalized to grams/ml. Packs are rounded up and linked to the actual ASDA product where the catalogue has a match.</p></div>${rows}`}
function renderRecipes(){let q=($("recipeSearch")?.value||"").toLowerCase();let cat=$("recipeCat")?.value||"All";let list=recipes.filter(r=>(cat==="All"||r.category===cat)&&(!q||(r.name+" "+r.tags.join(" ")).toLowerCase().includes(q)));$("recipeList").innerHTML=list.map(r=>`<div class="card"><div class="meal"><div class="meal-icon">${r.icon}</div><div class="meal-main"><div class="meal-name">${esc(r.name)}</div><div class="meal-meta">${r.kcal} kcal · ${r.protein}g protein · ${r.totalMinutes} min</div><div>${r.tags.slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></div><button class="btn small" onclick="showRecipe('${r.id}')">View</button></div></div>`).join("")||`<div class="empty">No recipes found.</div>`}
function renderRecipesScreen(){$("recipes").innerHTML=`<div class="hero"><h1>Recipe library</h1><p>${recipes.length} recipes · high protein, meal prep, low calorie and cuisine collections.</p></div><div class="card"><div class="field"><label>Search</label><input id="recipeSearch" class="search" oninput="renderRecipes()" placeholder="Chicken, curry, pasta..."></div><div class="field"><label>Meal</label><select id="recipeCat" onchange="renderRecipes()"><option>All</option><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></div></div><div id="recipeList"></div>`;renderRecipes()}
function renderProfile(){let p=state.profile;$("profile").innerHTML=`<div class="section-title">Planner settings</div><div class="card"><div class="grid"><div class="field"><label>Daily calories</label><input id="cal" type="number" value="${p.calories}"></div><div class="field"><label>Protein (g)</label><input id="pro" type="number" value="${p.protein}"></div><div class="field"><label>Weekly budget (£)</label><input id="bud" type="number" value="${p.budget}"></div><div class="field"><label>Meals/day</label><input id="meals" type="number" value="${p.meals}"></div></div><div class="field"><label>Dislikes</label><input id="dis" value="${esc(p.dislikes)}" placeholder="mushrooms, olives"></div><div class="field"><label>Foods you like</label><input id="likes" value="${esc(p.likes)}"></div><button class="btn" onclick="saveProfile()">Save & regenerate</button></div><div class="card"><b>ASDA catalogue</b><p class="muted">${products.length} ASDA catalogue products currently loaded. The catalogue refresh uses ASDA's official sitemap and product pages.</p></div>`}
function saveProfile(){state.profile={...state.profile,calories:+$("cal").value,protein:+$("pro").value,budget:+$("bud").value,meals:+$("meals").value,dislikes:$("dis").value,likes:$("likes").value};save();generate()}
function showTab(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active",x.dataset.tab===id));if(id==="home")renderHome();if(id==="week")renderWeek();if(id==="recipes")renderRecipesScreen();if(id==="shop")renderShop();if(id==="profile")renderProfile()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
async function init(){try{[recipes,products,ingredients]=await Promise.all([fetch("data/recipes.json").then(r=>r.json()),fetch("data/products.json").then(r=>r.json()),fetch("data/ingredients.json").then(r=>r.json())]);if(!state.week.length)generate();else renderAll()}catch(e){console.error(e);$("home").innerHTML='<div class="empty">Could not load planner data. Check that the data folder was uploaded with the site.</div>'}}
function renderAll(){renderHome();renderWeek();renderRecipesScreen();renderShop();renderProfile()}
init();
</script>
</body>
</html>
