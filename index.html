g pan over medium heat for 5–7 minutes, turning until fully cooked (75°C at the thickest point).","Stir the Greek yoghurt until smooth and use it as the wrap dressing.","Spread the yoghurt on the wrap, add the chicken and mixed salad, then roll tightly."],"beefpasta":["Cook the pasta according to the packet instructions and drain.","Cook the beef mince in a non-stick pan, breaking it up and stirring until browned and fully cooked.","Add the chopped tomatoes and frozen vegetables. Simmer for 8–10 minutes until the vegetables are hot and the sauce thickens.","Stir the pasta through the beef sauce and serve."],"tunasweet":["Prick the potato with a fork and microwave until soft, turning halfway, or bake at 200°C until tender.","Drain the tuna and sweetcorn, then mix with the Greek yoghurt.","Split the hot potato and pile the tuna mixture on top. Heat the sweetcorn with the tuna mixture briefly if you prefer it warm."],"tofurice":["Rinse and cook the rice according to the packet instructions.","Pat the tofu dry and cut into cubes. Use a hot non-stick pan to brown the cubes on several sides.","Add the frozen vegetables and cook until piping hot and tender, about 5–7 minutes.","Stir through the soy sauce and serve over the rice."],"turkeychilli":["Rinse and cook the rice according to the packet instructions.","Add the turkey mince to a non-stick pan and cook, breaking it apart, until no pink remains.","Add the kidney beans, chopped tomatoes and frozen vegetables. Simmer for 12–15 minutes until thick and the turkey is cooked through (75°C).","Serve the turkey chilli over the rice."],"chickentray":["Heat the oven to 200°C (180°C fan). Cut the potatoes into bite-sized chunks and toss with the oil.","Place the potatoes on a baking tray and roast for 15 minutes.","Add the chicken breast and frozen vegetables to the tray, turn the potatoes and roast for another 20–25 minutes, until the chicken reaches 75°C and the potatoes are golden and tender.","Rest the chicken for 2–3 minutes, then portion with the potatoes and vegetables."],"porknoodles":["Cook the noodles according to the packet instructions, then drain.","Slice the pork thinly. Cook in a hot non-stick frying pan, stirring, until browned and cooked through.","Add the frozen vegetables and stir-fry for 5–7 minutes until hot and tender.","Add the noodles and soy sauce, toss together for 1–2 minutes and serve."],"lentilcurry":["Rinse the rice and cook according to the packet instructions.","Put the lentils, chickpeas, chopped tomatoes and curry powder in a saucepan with enough water to cover the lentils well; bring to a simmer.","Simmer for 20–25 minutes, stirring often and adding a splash of water if it becomes too thick, until the lentils are soft. (If using ready-cooked lentils, simmer for 10–12 minutes instead.)","Serve the curry over rice."],"edamamesnack":["Cook the edamame according to the packet instructions (usually boil or microwave until piping hot).","Drain well and allow to cool until comfortable to eat.","Serve with the fruit. Add salt only if you have it and want it."],"cottagecrackers":["Spoon the cottage cheese into a bowl.","Slice the cucumber into sticks or rounds.","Serve the cottage cheese with the cucumber and wholegrain crackers."],"extra1":["Mix the Greek yoghurt, oats and peanut butter in a bowl or lidded jar until evenly combined.","Slice the banana and stir half through, reserving the rest for the top if preferred.","Eat straight away for a chewy texture, or cover and refrigerate overnight to soften the oats."],"extra2":["Put the oats, milk and cocoa powder in a saucepan and simmer gently for 4–6 minutes, stirring, until the oats are soft. Add a splash of water if needed.","Remove from the heat and leave for 1–2 minutes so it is not boiling hot. Stir in the protein powder until smooth.","Slice the banana over the top and serve. Avoid boiling the protein powder directly, as it can become lumpy."],"extra3":["Toast the bread and set aside.","Beat the eggs and cook in a non-stick pan over low heat, stirring until softly scrambled and fully set.","Remove from the heat and fold in the smoked salmon so it warms gently. Serve with the toast."],"extra4":["Dice the potato into small cubes. Microwave with a splash of water for 3–4 minutes to speed up cooking, then drain.","Slice the turkey sausages. Brown them in a non-stick pan according to pack directions, ensuring they are cooked through.","Add the potato cubes and cook until golden, stirring regularly. Add the spinach and stir until wilted.","Cook the egg in the pan or separately to your liking, ensuring the white is set, then serve on top of the hash."],"extra5":["Blend or mash the cottage cheese, eggs and oats into a thick batter.","Heat a good non-stick pan over medium-low heat. Spoon in small pancakes and cook for 2–3 minutes per side, turning when the edges set.","Heat the berries in a small pan or microwave until juicy and serve over the pancakes."],"extra6":["Brown the turkey mince in a non-stick pan, breaking it up until fully cooked through.","Beat the eggs, add them to the pan and stir until set. Dice the tomato and fold it through.","Warm the wrap, add the filling, tuck in the sides and roll into a burrito."],"extra7":["Core the apple and grate it or dice it finely.","Stir the oats, Greek yoghurt and cinnamon together in a lidded container, then fold through the apple.","Cover and refrigerate for at least 4 hours, preferably overnight. Stir before eating; the oats will soften as they absorb moisture."],"extra8":["Heat the oven to 180°C (160°C fan). Lightly grease a 3–4 cup muffin tin if needed.","Beat the eggs, then stir in the chopped spinach, crumbled feta and diced tomato.","Divide the mixture between muffin cups and bake for 15–20 minutes until puffed and set in the centre. Cool briefly before removing."],"extra9":["Beat the eggs in a shallow bowl and dip each slice of bread into the egg, coating both sides.","Cook in a non-stick frying pan over medium heat for 2–3 minutes per side, until golden and the egg is fully cooked.","Serve with the Greek yoghurt and berries. Thaw frozen berries briefly first if you prefer them less cold."],"extra10":["Stir the chia seeds and oats into the Greek yoghurt.","Fold through the frozen berries and add a small splash of water or milk only if you prefer a thinner pot.","Cover and refrigerate for at least 2 hours, ideally overnight, so the chia seeds and oats soften."],"extra11":["Cook the pasta according to the packet instructions. Reserve a small cup of pasta water before draining.","Slice the chicken into strips and cook in a non-stick pan until browned and cooked through (75°C at the thickest point).","Add the spinach to the pan and stir until wilted. Toss with the drained pasta and pesto, loosening with a little reserved pasta water if needed."],"extra12":["Heat the oven to 200°C (180°C fan). Cut the potato into wedges or cubes and roast until golden and tender, about 25–35 minutes, turning halfway.","Cook the chicken in a non-stick pan until browned and cooked through (75°C at the thickest point), then slice or chop.","Mix the Greek yoghurt with the hot sauce. Serve the chicken and potatoes over the mixed salad and drizzle with the sauce."],"extra13":["Cook the noodles according to the packet instructions, then drain.","Slice the chicken into thin strips and stir-fry in a non-stick pan until cooked through.","Add the frozen vegetables and stir-fry for 5–7 minutes until piping hot. Mix the soy sauce and honey, pour into the pan and toss to coat.","Add noodles, toss for a further minute and serve."],"extra14":["Cook the chicken in a non-stick pan until golden and cooked through (75°C at the thickest point), then slice.","Spread the Caesar dressing over the wrap.","Add the mixed salad and chicken, fold in the sides and roll tightly. Keep the dressing separate if preparing ahead to avoid a soggy wrap."],"extra15":["Heat the oven to 200°C (180°C fan). Pierce the sweet potato with a fork and rumble the feta.","Serve the chicken over couscous with the vegetables and feta."],"extra27":["Cook the pasta according to the packet instructions and drain.","Slice the turkey sausages and brown them in a pan according to the packet instructions, ensuring they are cooked through.","Add the chopped tomatoes and cannellini beans; simmer for 8–10 minutes. Stir in the spinach until wilted.","Toss the sauce with the pasta and serve."],"extra28":["Rinse and cook the rice according to packet instructions.","Cut the chicken into bite-sized pieces and cook in a non-stick pan until browned and cooked through (75°C at the thickest point).","Add the frozen vegetables and cook until piping hot. Pour in the teriyaki sauce and simmer for 1–2 minutes to coat the chicken and vegetables.","Serve over the rice."],"extra29":["Cook the noodles according to packet instructions, then drain.","Brown the beef mince in a hot non-stick pan until fully cooked.","Add the broccoli with a splash of water, cover and steam-fry for 4–6 minutes until tender and hot.","Add soy sauce and noodles, toss for 1–2 minutes and serve."],"extra30":["Cook the pasta according to packet instructions and drain.","Mix the turkey mince into small meatballs with clean hands. Brown in a non-stick pan, turning gently until cooked through; the centre should reach 75°C.","Add chopped tomatoes and simmer for 10–12 minutes until the sauce thickens and the meatballs are cooked through.","Serve over pasta and finish with the grated parmesan."],"extra31":["Heat the oven to 200°C (180°C fan). Rinse and cook the rice until just tender.","Cut the chicken into small pieces and cook in a non-stick pan until cooked through (75°C).","Mix the rice, chicken, chopped tomatoes and kidney beans in an ovenproof dish. Scatter the cheddar over the top.","Bake for 15–20 minutes until bubbling and hot throughout. Let stand for 5 minutes before portioning."],"extra32":["Cook the pasta according to packet instructions and drain, reserving a little pasta water.","Slice the chicken and cook in a non-stick pan until browned and cooked through (75°C at the thickest point). Remove to a plate.","Cook the sliced mushrooms in the same pan until softened. Stir in the light cream cheese and a splash of pasta water until a sauce forms.","Add the spinach until wilted, return the chicken to the pan and toss with the pasta."],"extra33":["Heat the oven to 200°C (180°C fan). Cut the potatoes into bite-sized chunks and roast for 25–35 minutes until tender, turning halfway.","Cook the chicken in a non-stick pan until browned and cooked through (75°C at the thickest point).","Mix the honey and mustard, brush over the chicken near the end of cooking and heat for another minute.","Steam or microwave the green beans until tender and serve with the chicken and potatoes."],"extra34":["Peel and chop the potatoes. Boil for 15–20 minutes until tender.","Meanwhile, sear the pork in a hot non-stick pan, then lower the heat and cook until the centre reaches 70°C followed by a 3-minute rest, or follow the pack instructions. Rest before slicing.","Drain the potatoes, mash until smooth, then stir in the Greek yoghurt.","Steam or microwave the green beans until tender and serve alongside the sliced pork and mash."],"extra35":["Dice the potato and boil for 15–20 minutes until soft; drain well and mash.","Brown the beef mince in a pan, breaking it up. Add diced carrot, peas and chopped tomatoes and simmer for 10–12 minutes until the mince is fully cooked and the mixture thickens.","Spoon the beef mixture into a bowl and top with the mashed potato. For a browned top, place under a hot grill for 3–5 minutes in an oven-safe dish."],"extra36":["Rinse and cook the rice according to packet instructions.","Cook the salmon in a non-stick pan or at 200°C oven heat until it flakes easily and is cooked through; follow the pack instructions for thickness.","Steam or microwave the broccoli until tender.","Brush or spoon teriyaki sauce over the salmon f tomatoes plus enough water to cover the lentils. Simmer for 18–25 minutes, stirring and topping up water as needed until tender.","Serve the lentil sauce over pasta."],"extra43":["Prepare the couscous according to packet instructions, then fluff with a fork.","Cut the halloumi into slices and cook in a non-stick pan for 1–2 minutes per side until golden.","Cook the courgette and peppers in the same pan until softened. Drain and rinse the chickpeas and warm them through with the vegetables.","Serve the roasted vegetables, chickpeas and halloumi over couscous."],"extra44":["Rinse and cook the rice according to packet instructions.","Drain and rinse the kidney beans, black beans and cannellini beans.","Combine all beans with chopped tomatoes in a saucepan. Simmer for 12–15 minutes, stirring occasionally, until thick and piping hot.","Serve the three-bean chilli over rice."],"extra45":["Heat the oven to 190°C (170°C fan). Halve the peppers lengthways and remove the seeds. Place cut-side up in an ovenproof dish.","Cook the rice until just tender. Brown the turkey mince in a non-stick pan until fully cooked, then stir in the chopped tomatoes and rice.","Spoon the turkey mixture into the pepper halves and sprinkle over the cheddar.","Add a small splash of water to the dish, cover loosely with foil and bake for 25–35 minutes until the peppers are tender and the filling is hot."],"extra46":["Dice the carrot and celery. Cut the chicken into small pieces.","Put the chicken stock, carrot, celery and lentils in a saucepan and bring to a simmer. Cook lentils according to type and packet directions until nearly tender.","Add the chicken and simmer until fully cooked (75°C at the thickest piece) and the lentils are soft, usually 10–15 minutes more. Add water if the soup becomes too thick.","Taste, check the chicken is cooked through, and serve hot."],"extra47":["Heat the oven to 200°C (180°C fan). Cut the potato into wedges and roast until golden and tender, about 25–35 minutes.","Shape the beef mince into a patty and cook in a hot non-stick pan for 4–6 minutes per side depending on thickness, until thoroughly cooked through.","Serve the patty over mixed salad with sliced or grated cheddar and burger sauce, alongside the wedges."],"extra48":["Rinse and cook the rice according to packet instructions.","Cut the chicken into strips. Toss with shawarma spices if supplied or already available, then cook in a non-stick pan until browned and cooked through (75°C).","Dice the cucumber and tomato. Stir the Greek yoghurt until smooth to make a simple sauce.","Serve the chicken over rice with the chopped salad and yoghurt."],"extra49":["Heat the oven to 200°C (180°C fan). Cut the potato and carrot into similar-sized chunks and slice the onion into wedges.","Toss the vegetables with olive oil on a baking tray and roast for 15 minutes.","Add the turkey sausages and turn the vegetables. Roast for another 20–25 minutes or as directed on the sausage pack, turning once, until the sausages are cooked through and vegetables are tender."],"extra50":["Dice the chicken and potato into small pieces. Add them to a saucepan with the chicken stock and simmer for 10–12 minutes.","Add the sweetcorn and milk. Simmer gently until the potato is soft and the chicken reaches 75°C at its thickest point; avoid a hard boil after adding milk.","Break up a few potato pieces against the side of the pan to thicken the chowder. Check seasoning if you have it and serve hot."],"extra51":["Warm the milk in a small saucepan or microwave until hot but not boiling.","Whisk the cocoa powder into a little of the warm milk to make a smooth paste, then whisk it into the remaining milk.","Let the drink cool slightly, then whisk in the whey protein powder until smooth. Do not boil the protein powder."],"extra52":["Wash and core the apple, then slice it into wedges.","Serve with the peanut butter for dipping. Measure the peanut butter separately if tracking calories."],"extra53":["Place the eggs in a saucepan and cover with cold water. Bring to a boil, then simmer for 9–10 minutes for hard-boiled eggs.","Cool the eggs under cold running water and peel.","Peel or wash the carrot and cut into sticks. Serve alongside the eggs."],"extra54":["Drain the tuna well and mix with the Greek yoghurt until it holds together.","Slice the cucumber into thick rounds or long batons.","Spoon the tuna mixture onto the cucumber or serve it alongside for dipping. Keep chilled until serving."],"extra55":["Pour the milk into a blender. Add the banana, peeled and broken into chunks.","Add the whey protein powder and blend until smooth, about 20–30 seconds.","Drink immediately or refrigerate promptly and use the same day; shake again before drinking."],"extra56":["Cook the edamame according to the packet instructions, boiling or microwaving until piping hot.","Drain well and sprinkle with sea salt if desired and available.","Let cool briefly and eat warm, or chill promptly for a cold snack."],"extra57":["Spread the light cream cheese over the lean ham slices.","Cut the cucumber into thin batons and place on the ham.","Roll each ham slice around the cucumber, seam-side down. Keep refrigerated until eating."],"extra58":["Spoon the cottage cheese into a bowl.","Add the frozen berries on top and let them thaw for a few minutes, or microwave separately for 20–30 seconds if you prefer a compote.","Stir together just before eating."],"extra59":["Heat the oven to 200°C (180°C fan). Drain and rinse the chickpeas, then pat very dry with a clean towel.","Toss the chickpeas with the olive oil and paprika, spreading them in one layer on a baking tray.","Roast for 25–35 minutes, shaking the tray halfway, until crisp. They crisp further as they cool; store in a dry airtight container and eat soon for best crunch."],"extra60":["Grate or finely dice the cucumber. If very watery, squeeze out excess moisture.","Mix the cucumber into the Greek yoghurt. Chill for 10–15 minutes so the flavours combine; rotein18":["Heat the oven to 200°C (180°C fan). Cut the potatoes into even chunks and boil for 8 minutes, then drain well.","Put the potatoes on a baking tray, toss with a little cooking oil if available and roast for 20 minutes. Add the salmon to the tray and bake for another 12–15 minutes, depending on thickness, until it flakes and is cooked through.","Steam or boil the green beans for 4–6 minutes until tender. Mix the Skyr with lemon juice and dill to make a cool sauce.","Serve the salmon with the potatoes, beans and lemon-yoghurt sauce. Keep the sauce separate if packing for later."],"protein19":["Cook the pasta according to its packet instructions. Reserve a little pasta water before draining.","Blend or mash the cottage cheese with the milk and garlic until smooth. If using a blender, scrape down the sides once.","Cut the chicken into small strips and pan-cook until browned and fully cooked (75°C). Add the spinach and stir until wilted.","Turn the heat to low. Stir in the cottage cheese sauce and drained pasta, adding a little pasta water to loosen it. Warm gently without boiling hard, then serve."],"protein20":["Mix the turkey mince with the finely diced onion. Shape into 8 small meatballs, washing hands and surfaces after handling raw mince.","Brown the meatballs in a large non-stick pan, turning gently. Add the passata and simmer covered for 10–12 minutes until the meatballs are cooked through (75°C in the centre).","Meanwhile, cook the orzo in boiling water according to the packet, then drain.","Stir the orzo into the tomato sauce, spoon into bowls and finish with the Parmesan."],"protein21":["Rinse the rice and cook according to the packet instructions.","Warm the curry paste in a saucepan for 30 seconds, stirring. Add the light coconut milk and a splash of water, then simmer for 3 minutes.","Add the prawns and simmer until opaque and cooked through; follow pack instructions if they are raw or already cooked. Add the spinach for the final 1–2 minutes until wilted.","Serve immediately over rice. Refrigerate leftovers promptly and reheat until piping hot only once."],"protein22":["Rinse and cook the rice according to the packet instructions.","Pat the tofu dry and cut into cubes. Brown in a non-stick pan on several sides for 6–8 minutes, turning as it colours.","Stir the curry paste and peanut butter together with the light coconut milk and a splash of water. Pour over the tofu and simmer gently for 5 minutes.","Add the broccoli and cook until tender but still bright green, adding a little water if the sauce thickens too much. Serve over rice."],"protein23":["Cut the potatoes into even chunks and boil for 12–15 minutes until tender; drain. Steam or boil the green beans for 4–6 minutes.","Trim the pork into medallions. Heat a non-stick pan and cook for 3–5 minutes per side depending on thickness, until cooked through (aim for 70°C and allow a 3-minute rest).","Remove the pan from the heat. Stir the mustard into the Skyr with a spoonful of warm water, then add it to the pan off the heat so the yoghurt stays creamy.","Serve the pork with the potatoes and beans, spooning the mustard-Skyr sauce over the meat."],"protein24":["Spoon the Skyr into a bowl and sift in the cocoa powder to avoid lumps.","Stir in the whey protein powder a little at a time until smooth. Add a teaspoon of cold water if the mixture becomes too thick.","Top with the berries and chill for 10 minutes for a thicker mousse texture, or eat straight away."],"protein25":["Stir the whey protein into the high-protein yoghurt until smooth. If it becomes very thick, add a teaspoon of water.","Spread the mixture in a thin layer on a baking-paper-lined tray or freezer-safe plate. Scatter the berries and finely chopped dark chocolate over the top.","Freeze for 2–3 hours until firm, then break into pieces. Eat straight from the freezer; it softens quickly. Freeze leftovers in a sealed container."],"protein26":["Crush the oat biscuits into fine crumbs and press them function recipeMethodSteps(r){
 const builtIn=builtInMethods[r.id];
 if(Array.isArray(builtIn)&&builtIn.length)return builtIn;
 const raw=String(r.method||'').trim();
 if(!raw||/^(add cooking steps when you have them\.?|prep all ingredients\..*)$/i.test(raw))return [];
 return raw.split(/\r?\n/).map(x=>x.trim().replace(/^\d+[.)]\s*/, '').replace(/^[-•]\s*/, '')).filter(Boolean);
}
function recipeMethodHtml(r){
 const steps=recipeMethodSteps(r);
 if(steps.length)return `<ol class="method-steps">${steps.map(step=>`<li>${escape(step)}</li>`).join('')}</ol>`;
 return `<div class="missing-method"><b>Cooking instructions missing</b><p>This recipe did not include reliable step-by-step instructions. Add the method in Edit recipe before preparing it; the app will not substitute a generic method.</p></div>`;
}

 const used={}; const choose=(cat,dayIndex,slotIndex)=>{let pool=groups[cat]||[];if(!pool.length)pool=recipes.filter(r=>r.cat===cat);let likes=(state.profile.likes||'').toLowerCase().split(',').map(x=>x.trim()).filter(Boolean);let priority=state.profile.priority||'Balanced';let scored=pool.map(r=>{let score=Math.random()*3;const hay=(r.name+' '+r.ings.map(x=>x[0]).join(' ')).toLowerCase();if(likes.some(x=>x&&hay.includes(x)))score+=2;if(r.custom)score+=1.5;if((state.favorites||[]).includes(r.id))score+=3;if(state.profile.avoidRepeat!==false)score-=(used[r.id]||0)*5;if(priority==='Cheapest')score-=(r.cost!==null&&r.cost!==undefined?+r.cost:99)*2;if(priority==='Protein value')score+=r.p/Math.max(.1,r.cost);if(state.profile.mealPrep||state.profile.batch)score+=(used[r.id]||0)*1.3;return {r,score}}).sort((a,b)=>b.score-a.score);let r=scored[0].r;used[r.id]=(used[r.id]||0)+1;return r};

function canonicalIngredientName(name){return String(name||'').trim().replace(/\s+/g,' ').toLowerCase().replace(/\byogurt\b/g,'yoghurt')}
function unitMeta(unit,name){

 if(['g','gram','grams'].includes(u))return {dim:'mass',factor:1,label:'g'};
 if(['kg','kilogram','kilograms'].includes(u))return {dim:'mass',factor:1000,label:'g'};
 if(['ml','millilitre','millilitres','milliliter','milliliters'].includes(u))return {dim:'volume',factor:1,label:'ml'};
 if(['l','litre','litres','liter','liters'].includes(u))return {dim:'volume',factor:1000,label:'ml'};
 if(['tsp','teaspoon','teaspoons'].includes(u))return {dim:'tsp',factor:1,label:'tsp'};
 if(['tbsp','tablespoon','tablespoons'].includes(u))return {dim:'tbsp',factor:1,label:'tbsp'};
 if(['slice','slices'].includes(u))return {dim:'slice',factor:1,label:'slices'};
 if(['portion','portions','serving','servings'].includes(u))return {dim:'portion',factor:1,label:'portions'};
 if(['piece','pieces','pcs','pc','each','ea',''].includes(u)){
  if(!u&&/cinnamon|paprika|seasoning|oil|salt|pepper|sauce|stock|powder|spice/i.test(name||''))return {dim:'unit',factor:1,label:'units'};

function buildShopping(){

  for(const [rawName,rawQty,rawUnit] of (r.ings||[])){
   const name=String(rawName||'').trim().replace(/\s+/g,' ');if(!name)continue;
   const key=canonicalIngredientName(name), qty=Number(rawQty)||0, unit=unitMeta(rawUnit,name);
   if(!map[key])map[key]={name,c:category(name),groups:{},unknown:false,pantryNotes:[]};
   const item=map[key];
   if(qty>0){
    if(!item.groups[unit.dim])item.groups[unit.dim]={need:0,remaining:0,label:unit.label,dim:unit.dim,pantry:0};
    item.groups[unit.dim].need+=qty*scale*unit.factor;
   }else item.unknown=true;
  }
 }
 // Deduct inventory case-insensitively, including g/kg and ml/l conversions.
 const stock={};
 for(const x of (state.pantry||[])){
  const key=canonicalIngredientName(x.name), meta=unitMeta(x.unit,x.name), qty=Math.max(0,Number(x.qty)||0);
  if(!stock[key])stock[key]={};
  if(!stock[key][meta.dim])stock[key][meta.dim]=0;

 }
 for(const [key,item] of Object.entries(map)){
  for(const [dim,g] of Object.entries(item.groups)){
   g.pantry=(stock[key]&&stock[key][dim])||0;
   const used=Math.min(g.need,g.pantry);g.remaining=Math.max(0,g.need-used);g.pantryUsed=used;
   if(g.pantry>0)item.pantryNotes.push(`${fmt(g.pantry)} ${g.label} in inventory`);
  }
  // When quantity is unknown, show pantry stock as context but never assume it is sufficient.
  if(item.unknown&&!item.pantryNotes.length&&stock[key])item.pantryNotes=Object.entries(stock[key]).map(([dim,q])=>`${fmt(q)} ${Object.keys(item.groups).includes(dim)?item.groups[dim].label:dim==='mass'?'g':dim==='volume'?'ml':dim==='each'?'pieces':'units'} in inventory`);
 }

}

function swapMeal(day,idx){

function filterSwapOptions(){

  const hay=(r.name+' '+r.cat+' '+r.ings.map(x=>x[0]).join(' ')).toLowerCase();

  const hasNumber=v=>v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v));

function updateAddPlanTargets(){

 if(modeSel.value==='extra'){targetWrap.style.display='none';return}

 if(url&&!/^https:\/\//i.test(url)){toast('Use an HTTPS API URL');return}

async function testImporterConnection(){
 const api=(document.getElementById('importApiUrl')?.value||localStorage.getItem('mealPlannerImportApiUrl')||'').trim().replace(/\/+$/,'');
 if(!api){setImportStatus('Enter your deployed API URL first.',true);return}
 if(!/^https:\/\//i.test(api)){setImportStatus('The importer API URL must start with https://.',true);return}
 const btns=[...document.querySelectorAll('#sheet button')];
 try{
  setImportStatus('Testing the importer service…');
  const res=await fetch(api+'/health',{signal:AbortSignal.timeout(12000)});let data={};try{data=await res.json()}catch(_){}
  if(!res.ok||!data.ok)throw new Error(data.error||`Health check failed (${res.status}).`);
  const notes=[];notes.push(data.aiConfigured?'AI key configured':'AI key missing on backend');notes.push(data.tokenConfigured?'access token configured':'access token missing on backend');
  setImportStatus(`API is reachable. ${notes.join('; ')}.\nNext, save the matching importer token and try a recipe link.` ,!data.aiConfigured||!data.tokenConfigured);
 }catch(e){setImportStatus(`${e.message||'Could not reach the API.'} Check the service URL, deployment status and ALLOWED_ORIGINS setting.`,true)}
}

async function importRecipeWithAI(){
 const url=(document.getElementById('newSource')?.value||'').trim();const pastedText=(document.getElementById('newNotes')?.value||'').trim();const videoFile=document.getElementById('newVideoFile')?.files?.[0]||null;
 let api=(document.getElementById('importApiUrl')?.value||localStorage.getItem('mealPlannerImportApiUrl')||'').trim().replace(/\/+$/,'');let token=(document.getElementById('importApiToken')?.value||localStorage.getItem('mealPlannerImportApiToken')||'').trim();
 if(!api){setImportStatus('First deploy the companion recipe-import API, then enter its HTTPS URL in “AI importer connection”. You can still fill in the recipe manually below.',true);return}
 if(!/^https:\/\//i.test(api)){setImportStatus('The importer API URL must start with https://.',true);return}
 if(!token){setImportStatus('Enter the backend access token in “AI importer connection” before importing.',true);return}
 if(!url&&!pastedText&&!videoFile){setImportStatus('Paste a recipe link, upload a saved video, or paste the recipe caption/transcript first.',true);return}
 if(url&&!/^https:\/\//i.test(url)){setImportStatus('Please use a full HTTPS link.',true);return}
 if(videoFile&&videoFile.size>50*1024*1024){setImportStatus('Video uploads must be 50 MB or smaller.',true);return}
 saveImporterConfig();const btn=document.getElementById('aiImportBtn');if(btn){btn.disabled=true;btn.textContent=videoFile?'Uploading video…':'Extracting…'}setImportStatus(videoFile?'Uploading video and analysing its audio and sampled frames. This can take a little while…':'Reading the source and extracting recipe details. Video transcription can take up to a minute…');
 try{
  let requestOptions, endpoint;
  if(videoFile){
   const body=new FormData();body.append('video',videoFile);if(url)body.append('url',url);if(pastedText)body.append('pastedText',pastedText);
   requestOptions={method:'POST',headers:{'x-import-token':token},body,signal:AbortSignal.timeout(180000)};endpoint='/api/import-video';
  }else{
   const headers={'Content-Type':'application/json','x-import-token':token};
   requestOptions={method:'POST',headers,body:JSON.stringify({url,pastedText}),signal:AbortSignal.timeout(150000)};endpoint='/api/import-recipe';
  }
  const res=await fetch(api+endpoint,requestOptions);let data={};try{data=await res.json()}catch(_){ }

  const r=data.recipe||data;const extraction=data.extraction||{};
  if(r.name)document.getElementById('newName').value=r.name;

  if(r.sourceUrl&&!document.getElementById('newSource').value)document.getElementById('newSource').value=r.sourceUrl;
  if(!pastedText&&r.transcript)document.getElementById('newNotes').value='Transcript extracted from source video:\n'+r.transcript;
  let warnings=Array.isArray(r.warnings)?[...r.warnings]:[];let missing=(r.ingredients||[]).filter(i=>i.quantity===null||i.quantity===undefined||i.quantity==='').length;
  if(missing)warnings.push(`${missing} ingredient quantity/quantities could not be confirmed. Check them before saving.`);

 }catch(e){setImportStatus(`${e.message||'Recipe extraction failed.'}\n\nIf TikTok blocked video downloading, save the video on your device (where available) and upload it using “Or upload a saved video”, or paste the caption/transcript.`,true)}
 finally{if(btn){btn.disabled=false;btn.textContent='Extract recipe with AI'}}
}
async function lookupTikTok(){const url=document.getElementById('newSource').value.trim();if(!url){toast('Paste a recipe URL first');return}if(!/tiktok\.com\//i.test(url)){toast('For title lookup, use a TikTok URL');return}try{const res=await fetch('https://www.tiktok.com/oembed?url='+encodeURIComponent(url));if(!res.ok)throw new Error('Metadata unavailable');const data=await res.json();const title=(data.title||'').replace(/\s+/g,' ').trim();if(title&&!document.getElementById('newName').value)document.getElementById('newName').value=title.slice(0,100);const notes=document.getElementById('newNotes');if(data.title&&!notes.value)notes.value='TikTok title/description: '+data.title;setImportStatus('Title loaded only. Use “Extract recipe with AI” after configuring the API, or complete the recipe manually.');}catch(e){setImportStatus('TikTok metadata could not be fetched from the browser. The backend may still be able to access the video; otherwise paste the caption/transcript manually.',true)}}
function openEditRecipe(id){
 const r=state.customRecipes.find(x=>x.id===id);if(!r){toast('Only your saved recipes can be edited here');return}
 editingRecipeId=id;
 document.getElementById('sheet').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>Edit recipe</h2><p class="sub">Review the extracted recipe and add any missing quantities or cooking steps. Changes are saved on this device.</p><div class="field"><label>Recipe name *</label><input id="editName"></div><div class="grid"><div class="field"><label>Meal type</label><select id="editCat"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></div><div class="field"><label>Icon</label><select id="editIcon"><option>🍽️</option><option>🥣</option><option>🍳</option><option>🥗</option><option>🍝</option><option>🍛</option><option>🌯</option><option>🍗</option><option>🍜</option><option>🥔</option></select></div></div><div class="grid"><div class="field"><label>Calories / serving</label><input id="editKcal" type="number" min="0"></div><div class="field"><label>Protein g / serving</label><input id="editProtein" type="number" min="0"></div><div class="field"><label>Estimated cost £ / serving</label><input id="editCost" type="number" min="0" step="0.05"></div><div class="field"><label>Recipe servings</label><input id="editServings" type="number" min="1"></div></div><div class="field"><label>Ingredients (one per line: name | quantity | unit)</label><textarea id="editIngredients" rows="7"></textarea></div><div class="field"><label>Cooking method (one real step per line)</label><textarea id="editMethod" rows="7" placeholder="1. Prepare ingredients…
2. Cook…
3. Serve…"></textarea></div><div class="actions"><button class="btn" onclick="saveEditedRecipe('${id}')">Save changes</button><button class="btn secondary" onclick="showRecipe('${id}')">Cancel</button></div>`;
 document.getElementById('editName').value=r.name||'';document.getElementById('editCat').value=r.cat||'Dinner';document.getElementById('editIcon').value=r.icon||'🍽️';document.getElementById('editKcal').value=r.kcal??'';document.getElementById('editProtein').value=r.p??'';document.getElementById('editCost').value=r.cost??'';document.getElementById('editServings').value=r.servings||1;document.getElementById('editIngredients').value=(r.ings||[]).map(x=>`${x[0]} | ${x[1]||''} | ${x[2]||''}`).join('\n');document.getElementById('editMethod').value=recipeMethodSteps(r).join('\n');document.getElementById('modal').style.display='flex';
}
function saveEditedRecipe(id){
 const r=state.customRecipes.find(x=>x.id===id);if(!r)return;const name=document.getElementById('editName').value.trim();if(!name){toast('Please add a recipe name');return}
 const ingredients=document.getElementById('editIngredients').value.split(/\n/).map(line=>line.trim()).filter(Boolean).map(line=>{const parts=line.split('|').map(x=>x.trim());const quantityText=parts[1]||'';const quantity=quantityText===''?0:parseFloat(quantityText);return [parts[0],Number.isFinite(quantity)?quantity:0,parts[2]||(quantityText===''?'quantity to confirm':'portion')] }).filter(x=>x[0]);if(!ingredients.length){toast('Add at least one ingredient');return}
 const servings=Math.max(1,+document.getElementById('editServings').value||1),ingredientsChanged=JSON.stringify(ingredients)!==JSON.stringify(r.ings)||servings!==(Math.max(1,Number(r.servings)||1));Object.assign(r,{name,cat:document.getElementById('editCat').value,icon:document.getElementById('editIcon').value,kcal:document.getElementById('editKcal').value.trim()===''?null:+document.getElementById('editKcal').value,p:document.getElementById('editProtein').value.trim()===''?null:+document.getElementById('editProtein').value,cost:document.getElementById('editCost').value.trim()===''?null:+document.getElementById('editCost').value,servings,ings:ingredients,method:document.getElementById('editMethod').value.trim(),nutritionStatus:ingredientsChanged?'estimated':r.nutritionStatus});recipes=[...builtInRecipes,...state.customRecipes];save();closeModal();renderAll();toast('Recipe updated');editingRecipeId=null;
}
function saveNewRecipe(){const name=document.getElementById('newName').value.trim();if(!name){toast('Please add a recipe name');return}const source=document.getElementById('newSource').value.trim();const raw=document.getElementById('newIngredients').value.split(/\n/).map(x=>x.trim()).filter(Boolean);let ings=[];for(const line of raw){const parts=line.split('|').map(x=>x.trim());const qtyText=parts[1]||'';const qty=qtyText===''?0:parseFloat(qtyText);if(parts[0])ings.push([parts[0],Number.isFinite(qty)?qty:0,parts[2]||(qtyText===''?'quantity to confirm':'portion')])}if(!ings.length){const note=document.getElementById('newNotes').value.trim();if(note){const lines=note.split(/\n|,|;/).map(x=>x.trim()).filter(x=>x.length>2&&x.length<70&&!/^(ingredients|method|directions|instructions|recipe)\b/i.test(x));ings=lines.slice(0,12).map(x=>[x,0,'quantity to confirm'])}}if(!ings.length){toast('Add at least one ingredient line');return}const id='user_'+Date.now();const r={id,name,icon:document.getElementById('newIcon').value,cat:document.getElementById('newCat').value,kcal:document.getElementById('newKcal').value.trim()===''?null:(+document.getElementById('newKcal').value),p:document.getElementById('newProtein').value.trim()===''?null:(+document.getElementById('newProtein').value),c:null,f:null,cost:document.getElementById('newCost').value.trim()===''?null:(+document.getElementById('newCost').value),ings,source,method:document.getElementById('newMethod').value.trim(),servings:+document.getElementById('newServings').value||1,nutritionStatus:document.getElementById('newNutritionStatus')?.value==='verified'?'verified':'estimated',custom:true};state.customRecipes.push(r);recipes.push(r);save();closeModal();renderRecipes();toast('Recipe added to your library')}

function showTab(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));if(id==='home')renderHome();if(id==='week')renderWeek();if(id==='shop')renderShop();if(id==='pantry')renderPantry();if(id==='recipes')renderRecipes();if(id==='profile')renderProfile()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function renderAll(){renderHome();renderWeek();renderShop();renderPantry();renderRecipes();renderProfile()}
if(!state.week.length)generateWeek();else renderAll();
</script></body></html>
